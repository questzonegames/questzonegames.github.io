<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0d1a3a"/>
      <stop offset="55%" stop-color="#040814"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef8ff"/>
      <stop offset="100%" stop-color="#bcd8ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe38a"/>
      <stop offset="45%" stop-color="#ffc233"/>
      <stop offset="100%" stop-color="#e08e00"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- scattered stars -->
  <g fill="#ffffff">
    <circle cx="30" cy="40" r="1.4" opacity="0.8"/>
    <circle cx="80" cy="20" r="1" opacity="0.6"/>
    <circle cx="340" cy="35" r="1.6" opacity="0.9"/>
    <circle cx="370" cy="80" r="1" opacity="0.5"/>
    <circle cx="20" cy="150" r="1.2" opacity="0.7"/>
    <circle cx="365" cy="170" r="1.3" opacity="0.7"/>
    <circle cx="50" cy="340" r="1.3" opacity="0.6"/>
    <circle cx="350" cy="330" r="1.5" opacity="0.8"/>
    <circle cx="200" cy="15" r="1.1" opacity="0.6"/>
    <circle cx="120" cy="370" r="1.2" opacity="0.6"/>
  </g>

  <!-- letter tiles spelling AQ -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <g transform="translate(80,150) rotate(-6)">
      <rect x="-32" y="-32" width="64" height="64" rx="12" fill="url(#tile)" stroke="#6fe3ff" stroke-width="4"/>
      <text x="0" y="20" font-size="46" fill="#10151c">A</text>
    </g>
    <g transform="translate(160,115) rotate(4)">
      <rect x="-32" y="-32" width="64" height="64" rx="12" fill="url(#tile)" stroke="#6fe3ff" stroke-width="4"/>
      <text x="0" y="20" font-size="46" fill="#10151c">N</text>
    </g>
    <g transform="translate(245,140) rotate(-3)">
      <rect x="-32" y="-32" width="64" height="64" rx="12" fill="url(#gold)" stroke="#ffe9a8" stroke-width="4"/>
      <text x="0" y="20" font-size="46" fill="#3a2200">Q</text>
    </g>
    <g transform="translate(320,190) rotate(7)">
      <rect x="-30" y="-30" width="60" height="60" rx="11" fill="url(#tile)" stroke="#6fe3ff" stroke-width="4"/>
      <text x="0" y="18" font-size="42" fill="#10151c">U</text>
    </g>
    <g transform="translate(120,235) rotate(5)">
      <rect x="-30" y="-30" width="60" height="60" rx="11" fill="url(#tile)" stroke="#6fe3ff" stroke-width="4"/>
      <text x="0" y="18" font-size="42" fill="#10151c">E</text>
    </g>
    <g transform="translate(230,255) rotate(-5)">
      <rect x="-30" y="-30" width="60" height="60" rx="11" fill="url(#tile)" stroke="#6fe3ff" stroke-width="4"/>
      <text x="0" y="18" font-size="42" fill="#10151c">S</text>
    </g>
  </g>

  <!-- bottom banner -->
  <rect x="0" y="322" width="400" height="78" fill="#000000" opacity="0.55"/>
  <text x="200" y="368" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34"
        text-anchor="middle" fill="#ffcf4d" stroke="#6b3f00" stroke-width="1.5"
        letter-spacing="1">ANAGRAM QUEST</text>
</svg>
