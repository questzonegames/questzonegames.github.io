<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="../assets/css/site.css">
<style>
  main.players { padding: 26px 0 60px; position: relative; z-index: 1; }

  .players-frame {
    position: relative;
    border: 3px solid transparent;
    border-radius: 16px;
    padding: 30px clamp(16px, 3vw, 40px) 36px;
    background: var(--qp-fill) padding-box, var(--chrome-frame) border-box;
  }
  .players-frame::after {
    content: '';
    position: absolute; left: 8%; right: 8%; bottom: -3px; height: 2px;
    background: var(--edge-blue);
    box-shadow: 0 0 14px 2px rgba(90,180,255,0.5);
    pointer-events: none;
  }
  .players-heading {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    margin: 0 0 clamp(18px, 2.6vw, 26px);
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-style: italic;
    font-size: clamp(20px, 3vw, 30px); letter-spacing: 0.12em; text-align: center;
    background: linear-gradient(180deg, #fff 0%, #cfd9ee 40%, #93a3c4 60%, #eef3fc 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 18px rgba(120,170,255,0.6), 0 2px 1px rgba(0,0,0,0.6);
  }
  .players-heading .dash {
    flex: 1 1 60px; max-width: 90px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--blue-light), transparent);
    opacity: 0.9;
  }

  /* ---- search box ---- */
  .players-search-wrap { max-width: 560px; margin: 0 auto 28px; position: relative; }
  .players-search-wrap::before {
    content: '🔍'; position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
    font-size: 16px; opacity: 0.55; pointer-events: none;
  }
  #players-search-input {
    width: 100%; padding: 15px 18px 15px 46px; border-radius: 12px;
    border: 1.5px solid var(--border-strong);
    background: linear-gradient(180deg, rgba(140,170,255,0.09) 0%, rgba(140,170,255,0) 26%, #070b16 100%);
    color: var(--text); font-size: 15px; font-family: 'Exo 2', sans-serif;
    box-shadow: inset 0 1px 0 rgba(190,210,255,0.1), 0 0 0 rgba(59,130,246,0);
    transition: border-color 0.15s ease, box-shadow 0.2s ease;
  }
  #players-search-input::placeholder { color: var(--text-faint); }
  #players-search-input:focus {
    outline: none; border-color: var(--blue-light);
    box-shadow: inset 0 1px 0 rgba(200,220,255,0.16), 0 0 0 4px rgba(59,130,246,0.16), 0 0 18px rgba(70,140,255,0.25);
  }

  /* ---- states (empty prompt / no results / loading) ---- */
  .players-state {
    max-width: 480px; margin: 40px auto; text-align: center;
    color: var(--text-dim); font-size: 13.5px; line-height: 1.6;
  }
  .players-state .icon { font-size: 34px; margin-bottom: 12px; filter: drop-shadow(0 0 14px rgba(120,170,255,0.45)); }
  .players-state strong { display: block; color: var(--text); font-family: 'Orbitron', sans-serif; letter-spacing: 0.06em; font-size: 13px; margin-bottom: 6px; text-transform: uppercase; }

  /* ---- results list ---- */
  .players-results { display: flex; flex-direction: column; gap: 10px; max-width: 560px; margin: 0 auto; }
  .player-row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; border-radius: 11px;
    border: 1.5px solid var(--border-strong);
    background: linear-gradient(180deg, rgba(140,170,255,0.07) 0%, rgba(140,170,255,0) 30%, #080c18 100%);
    color: var(--text); text-decoration: none;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .player-row:hover {
    border-color: var(--blue-light);
    background: linear-gradient(180deg, rgba(59,130,246,0.14) 0%, rgba(140,170,255,0) 30%, #080c18 100%);
    transform: translateY(-1px);
  }
  .player-row:active { transform: translateY(0); }
  .player-avatar-thumb {
    flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%;
    position: relative; overflow: hidden;
    background: radial-gradient(circle at 35% 30%, rgba(140,170,255,0.22), rgba(6,10,20,0.9) 70%);
    border: 1.5px solid rgba(140,195,255,0.35);
    box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
  }
  .player-avatar-thumb svg { width: 22px; height: 22px; color: #9ab6ea; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
  /* Real avatar thumbnail — a flat PNG snapshot (see snapshotAvatar() below)
     of the exact same avatar-viewer.js render used on the profile page,
     taken at a normal, full render size and then displayed here scaled
     down as a plain image. This is deliberate: mounting a LIVE avatar-
     viewer instance directly into a 44px circle at a large CSS zoom used
     to throw off equipped items positioned in absolute pixels (computed
     against that tiny container's own size), so a crown that sits
     correctly on the real profile came out visibly offset in the small
     circle. A flat snapshot can't drift from the real render — it IS the
     real render, just scaled — and plain image scaling can't misplace a
     layer relative to another the way re-running layout math at a
     different container size could. */
  .player-avatar-thumb img.snapshot {
    position: absolute; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 18%;
  }
  /* The hidden, full-size render snapshotAvatar() mounts each avatar into
     before capturing it — needs the SAME padding avatar-viewer.js's real
     .avatar-sprite CSS uses everywhere else (profile/index.html, skills.
     html, etc.), since computeContentBox() reads it back via
     getComputedStyle() to know where the sprite content box actually
     starts. Nothing here is ever visible; the element sits off-screen. */
  .qz-avatar-snapshot-rig .avatar-sprite { padding: 9% 11% 5%; }
  .player-row-main { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .player-row-name {
    font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 14px;
    letter-spacing: 0.02em; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .player-banned-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 6px;
    font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase;
    background: rgba(240,70,70,0.16); color: #ff9d9d; border: 1px solid rgba(240,90,90,0.45);
    box-shadow: 0 0 10px rgba(240,70,70,0.2);
    white-space: nowrap;
  }
  .player-row-arrow { flex: 0 0 auto; color: var(--text-faint); font-size: 16px; }

  .players-load-more { text-align: center; margin-top: 18px; }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="../assets/js/qz-config.js"></script>
<script src="../assets/js/qz-auth.js"></script>

<script src="../assets/js/inventory-data.js"></script>
<script type="module" src="../assets/js/avatar-viewer.js"></script>
<script>
(function () {
  // Live player search — debounced ~250ms so a fast typist doesn't fire a
  // database request per keystroke, and backed entirely by the
  // search_public_players() RPC (see supabase/migrations/
  // 20260906060000_players_search_and_public_profiles.sql), which already
  // excludes permanently banned, hidden, and deleted accounts server-side.
  // This page never queries public.profiles directly.
  const PERSON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.4"/><path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"/></svg>';
  const DEBOUNCE_MS = 250;
  const RESULT_LIMIT = 20;

  const input = document.getElementById('players-search-input');
  const stateEl = document.getElementById('players-state');
  const resultsEl = document.getElementById('players-results');

  let debounceTimer = null;
  let requestSeq = 0; // guards against an older, slower request overwriting a newer one

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function showState(icon, title, body) {
    renderGen++; // invalidate any snapshot still being rendered for the previous results
    stateEl.innerHTML = '<div class="icon">' + icon + '</div><strong>' + escapeHtml(title) + '</strong>' + escapeHtml(body);
    stateEl.hidden = false;
    resultsEl.hidden = true;
  }

  // Each result's real front-facing avatar shown as a flat PNG snapshot —
  // see the CSS comment above .player-avatar-thumb img.snapshot for why a
  // snapshot instead of mounting a live avatar-viewer straight into the
  // small circle. `renderGen` guards against a slow, still-in-flight
  // snapshot from an OLDER search landing after a newer one has already
  // replaced the results list (a fast typist's earlier keystroke finishing
  // its render work after a later one).
  let renderGen = 0;
  const SNAPSHOT_W = 240, SNAPSHOT_H = 320;

  // Polls until every image avatar-viewer.js actually intends to show
  // (opacity !== '0' — it briefly creates hidden images for other poses/
  // broken items) has finished loading, or gives up after timeoutMs so one
  // broken/slow image can never hang a whole search result forever.
  function waitForAvatarImages(container, timeoutMs) {
    return new Promise((resolve) => {
      const start = Date.now();
      (function poll() {
        const imgs = Array.from(container.querySelectorAll('img')).filter((img) => {
          return img.getAttribute('src') && getComputedStyle(img).opacity !== '0';
        });
        const ready = imgs.length > 0 && imgs.every((img) => img.complete);
        if (ready || Date.now() - start > timeoutMs) {
          // two rAFs: one for this frame's style/layout to settle, one to
          // be sure the browser has actually painted before we read rects
          requestAnimationFrame(() => requestAnimationFrame(resolve));
        } else {
          setTimeout(poll, 40);
        }
      })();
    });
  }

  // Renders one account's avatar at a normal, full size off-screen (same
  // code path, same relative proportions as the real profile page —
  // avatar-viewer.js never even knows this render is destined for a tiny
  // circle), then flattens it into a single PNG data URL by drawing each
  // visible layer onto a canvas in the same order/positions it's actually
  // showing on screen. avatar-sprite layers (base body, hair, pre-baked
  // equip-frame overlays) use object-fit:contain letterboxing, so those
  // use avatar-viewer.js's own computeContentBox/computeRenderedImageRect
  // math (the same formula the real renderer and Avatar Rig editor share)
  // rather than the element's own box. Live-calibrated equip layers
  // (avatar-equip-live, e.g. the crown) are already absolutely positioned
  // in real pixels by avatar-viewer.js itself, so their own
  // getBoundingClientRect() is exactly right as-is.
  async function snapshotAvatar(row) {
    if (!window.QZAvatarViewer) return null;
    const AV = window.QZAvatarViewer;
    const mountEl = document.createElement('div');
    mountEl.className = 'qz-avatar-snapshot-rig';
    mountEl.style.cssText = 'position:fixed; left:-9999px; top:-9999px; width:' + SNAPSHOT_W + 'px; height:' + SNAPSHOT_H + 'px; pointer-events:none;';
    document.body.appendChild(mountEl);
    const avatar = AV.mount(mountEl, { staticFront: true });
    try {
      const catalogById = {};
      (window.QZ_ITEM_CATALOG || []).forEach((it) => { catalogById[it.id] = it; });
      const equipped = {};
      (row.equipped_items || []).forEach((r) => { if (r.item_id && catalogById[r.item_id]) equipped[r.slot] = catalogById[r.item_id]; });
      avatar.setAvatarEquipment(equipped);
      if (avatar.setBaseAppearance && row.avatar_gender) {
        avatar.setBaseAppearance(row.avatar_gender, row.avatar_skin_colour);
        if (avatar.setHairstyle) avatar.setHairstyle(row.avatar_hair_style, row.avatar_hair_colour);
      }

      await waitForAvatarImages(mountEl, 1200);

      const canvas = document.createElement('canvas');
      canvas.width = SNAPSHOT_W;
      canvas.height = SNAPSHOT_H;
      const ctx = canvas.getContext('2d');
      const containerRect = mountEl.getBoundingClientRect();
      Array.from(mountEl.querySelectorAll('img')).forEach((img) => {
        if (!img.complete || !img.naturalWidth) return;
        if (getComputedStyle(img).opacity === '0') return;
        try {
          if (img.classList.contains('avatar-sprite')) {
            const box = AV.computeContentBox(mountEl, img);
            const r = AV.computeRenderedImageRect(box, img.naturalWidth, img.naturalHeight);
            ctx.drawImage(img, r.left, r.top, r.width, r.height);
          } else {
            const r = img.getBoundingClientRect();
            ctx.drawImage(img, r.left - containerRect.left, r.top - containerRect.top, r.width, r.height);
          }
        } catch (e) { /* one layer failing to draw shouldn't blank the rest */ }
      });
      return canvas.toDataURL('image/png');
    } finally {
      try { avatar.destroy(); } catch (e) {}
      mountEl.remove();
    }
  }

  async function fillThumb(el, row, myGen) {
    const dataUrl = await snapshotAvatar(row).catch(() => null);
    if (myGen !== renderGen || !el.isConnected) return; // superseded or scrolled away
    if (!dataUrl) { el.innerHTML = PERSON_ICON; return; }
    const img = document.createElement('img');
    img.className = 'snapshot';
    img.alt = '';
    img.src = dataUrl;
    el.innerHTML = '';
    el.appendChild(img);
  }

  function renderResults(rows) {
    const myGen = ++renderGen;
    resultsEl.innerHTML = rows.map((row, i) => {
      const badge = row.is_banned
        ? '<span class="player-banned-badge">Temporarily Banned</span>'
        : '';
      return '<a class="player-row" href="index.html?player=' + encodeURIComponent(row.username) + '">' +
        '<span class="player-avatar-thumb" id="player-thumb-' + i + '">' + PERSON_ICON + '</span>' +
        '<span class="player-row-main"><span class="player-row-name">' + escapeHtml(row.username) + '</span>' + badge + '</span>' +
        '<span class="player-row-arrow">›</span>' +
      '</a>';
    }).join('');
    stateEl.hidden = true;
    resultsEl.hidden = false;
    rows.forEach((row, i) => {
      const el = document.getElementById('player-thumb-' + i);
      if (el) fillThumb(el, row, myGen);
    });
  }

  async function runSearch(query) {
    const mySeq = ++requestSeq;
    if (!window.QZAuth || !window.QZAuth.configured || !window.QZAuth.client) {
      showState('⚠️', 'Search unavailable', 'Accounts aren’t configured on this deployment yet.');
      return;
    }
    const { data, error } = await window.QZAuth.client.rpc('search_public_players', {
      p_query: query, p_limit: RESULT_LIMIT, p_offset: 0
    });
    if (mySeq !== requestSeq) return; // a newer keystroke's request already landed
    if (error) {
      showState('⚠️', 'Something went wrong', 'Could not search players right now — try again shortly.');
      return;
    }
    if (!data || !data.length) {
      showState('🚫', 'No Players Found', 'Try another username.');
      return;
    }
    renderResults(data);
  }

  input.addEventListener('input', () => {
    const q = input.value.trim();
    clearTimeout(debounceTimer);
    if (!q) {
      requestSeq++; // invalidate any in-flight request
      showState('🔎', 'Find a Player', 'Search for a Quest Zone username to view their profile.');
      return;
    }
    debounceTimer = setTimeout(() => runSearch(q), DEBOUNCE_MS);
  });
})();
</script>
