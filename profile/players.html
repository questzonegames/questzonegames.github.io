<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Players — Quest Zone</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  main.players { padding: 26px 0 60px; position: relative; z-index: 1; }

  .players-frame {
    position: relative;
    border: 3px solid transparent;
    border-radius: 16px;
    padding: 30px clamp(16px, 3vw, 40px) 36px;
    background: var(--qp-fill) padding-box, var(--chrome-frame) border-box;
  }
  .players-frame::after {
    content: '';
    position: absolute; left: 8%; right: 8%; bottom: -3px; height: 2px;
    background: var(--edge-blue);
    box-shadow: 0 0 14px 2px rgba(90,180,255,0.5);
    pointer-events: none;
  }
  .players-heading {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    margin: 0 0 clamp(18px, 2.6vw, 26px);
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-style: italic;
    font-size: clamp(20px, 3vw, 30px); letter-spacing: 0.12em; text-align: center;
    background: linear-gradient(180deg, #fff 0%, #cfd9ee 40%, #93a3c4 60%, #eef3fc 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 18px rgba(120,170,255,0.6), 0 2px 1px rgba(0,0,0,0.6);
  }
  .players-heading .dash {
    flex: 1 1 60px; max-width: 90px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--blue-light), transparent);
    opacity: 0.9;
  }

  /* ---- search box ---- */
  .players-search-wrap { max-width: 560px; margin: 0 auto 28px; position: relative; }
  .players-search-wrap::before {
    content: '🔍'; position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
    font-size: 16px; opacity: 0.55; pointer-events: none;
  }
  #players-search-input {
    width: 100%; padding: 15px 18px 15px 46px; border-radius: 12px;
    border: 1.5px solid var(--border-strong);
    background: linear-gradient(180deg, rgba(140,170,255,0.09) 0%, rgba(140,170,255,0) 26%, #070b16 100%);
    color: var(--text); font-size: 15px; font-family: 'Exo 2', sans-serif;
    box-shadow: inset 0 1px 0 rgba(190,210,255,0.1), 0 0 0 rgba(59,130,246,0);
    transition: border-color 0.15s ease, box-shadow 0.2s ease;
  }
  #players-search-input::placeholder { color: var(--text-faint); }
  #players-search-input:focus {
    outline: none; border-color: var(--blue-light);
    box-shadow: inset 0 1px 0 rgba(200,220,255,0.16), 0 0 0 4px rgba(59,130,246,0.16), 0 0 18px rgba(70,140,255,0.25);
  }

  /* ---- Top 3 Total Level showcase ---- */
  .players-top3-wrap { max-width: 900px; margin: 0 auto 34px; }
  .players-top3-heading {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin: 0 0 16px; font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: 12.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--text-dim);
  }
  .players-top3 {
    display: flex; align-items: flex-end; justify-content: center;
    gap: clamp(10px, 2.4vw, 22px); flex-wrap: wrap;
  }
  .top3-card {
    flex: 1 1 180px; max-width: 220px; min-width: 150px;
    display: flex; flex-direction: column; align-items: center;
    text-decoration: none; color: inherit;
    padding: 16px 14px 18px; border-radius: 14px;
    border: 1.5px solid var(--border-strong);
    background: linear-gradient(180deg, rgba(140,170,255,0.08) 0%, rgba(140,170,255,0) 30%, #080c18 100%);
    transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
  .top3-card:hover { transform: translateY(-2px); }
  .top3-card[data-rank="1"] { border-color: rgba(255,207,77,0.55); box-shadow: 0 0 22px rgba(255,207,77,0.16); order: 2; }
  .top3-card[data-rank="2"] { border-color: rgba(201,211,224,0.5); box-shadow: 0 0 16px rgba(201,211,224,0.12); order: 1; }
  .top3-card[data-rank="3"] { border-color: rgba(217,143,74,0.5); box-shadow: 0 0 16px rgba(217,143,74,0.12); order: 3; }
  .top3-card[data-rank="1"]:hover { border-color: #ffcf4d; }
  .top3-card[data-rank="2"]:hover { border-color: #c9d3e0; }
  .top3-card[data-rank="3"]:hover { border-color: #d98f4a; }
  .top3-crown { font-size: 20px; line-height: 1; margin-bottom: 6px; filter: drop-shadow(0 0 6px rgba(0,0,0,0.5)); }
  .top3-rank-label {
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 12px;
    letter-spacing: 0.08em; margin-bottom: 10px;
  }
  .top3-card[data-rank="1"] .top3-rank-label { color: #ffcf4d; text-shadow: 0 0 10px rgba(255,207,77,0.5); }
  .top3-card[data-rank="2"] .top3-rank-label { color: #cdd6e4; text-shadow: 0 0 10px rgba(200,215,235,0.4); }
  .top3-card[data-rank="3"] .top3-rank-label { color: #e2934f; text-shadow: 0 0 10px rgba(217,143,74,0.4); }
  .top3-avatar-frame {
    position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: 10px;
    overflow: hidden; margin-bottom: 12px;
    border: 2px solid transparent;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(70,140,255,0.2), transparent 60%),
      linear-gradient(180deg, #060b16 0%, #030509 100%) padding-box,
      var(--chrome-frame-soft) border-box;
  }
  .top3-avatar-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .top3-name {
    font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 14.5px;
    color: #fff; text-align: center; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .top3-card:hover .top3-name { color: var(--blue-light); }
  .top3-level {
    margin-top: 4px; font-size: 12px; color: var(--text-dim);
    text-align: center;
  }
  .top3-level strong { color: var(--text); font-weight: 700; }
  .top3-banned-badge {
    margin-top: 6px; display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 6px;
    font-family: 'Orbitron', sans-serif; font-size: 8.5px; letter-spacing: 0.05em; text-transform: uppercase;
    background: rgba(240,70,70,0.16); color: #ff9d9d; border: 1px solid rgba(240,90,90,0.45);
  }
  @media (max-width: 560px) {
    .top3-card[data-rank] { order: initial; max-width: 260px; flex-basis: 100%; }
  }

  /* ---- states (empty prompt / no results / loading) ---- */
  .players-state {
    max-width: 480px; margin: 40px auto; text-align: center;
    color: var(--text-dim); font-size: 13.5px; line-height: 1.6;
  }
  .players-state .icon { font-size: 34px; margin-bottom: 12px; filter: drop-shadow(0 0 14px rgba(120,170,255,0.45)); }
  .players-state strong { display: block; color: var(--text); font-family: 'Orbitron', sans-serif; letter-spacing: 0.06em; font-size: 13px; margin-bottom: 6px; text-transform: uppercase; }

  /* ---- results list ---- */
  .players-results { display: flex; flex-direction: column; gap: 10px; max-width: 560px; margin: 0 auto; }
  .player-row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; border-radius: 11px;
    border: 1.5px solid var(--border-strong);
    background: linear-gradient(180deg, rgba(140,170,255,0.07) 0%, rgba(140,170,255,0) 30%, #080c18 100%);
    color: var(--text); text-decoration: none;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .player-row:hover {
    border-color: var(--blue-light);
    background: linear-gradient(180deg, rgba(59,130,246,0.14) 0%, rgba(140,170,255,0) 30%, #080c18 100%);
    transform: translateY(-1px);
  }
  .player-row:active { transform: translateY(0); }
  .player-avatar-thumb {
    flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%;
    position: relative; overflow: hidden;
    background: radial-gradient(circle at 35% 30%, rgba(140,170,255,0.22), rgba(6,10,20,0.9) 70%);
    border: 1.5px solid rgba(140,195,255,0.35);
    box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
  }
  .player-avatar-thumb svg { width: 22px; height: 22px; color: #9ab6ea; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
  /* Each result's chosen Profile Picture (see assets/js/profile-picture-
     picker.js) — a plain, picked static image, not a live-rendered
     avatar. A live avatar mounted straight into this small a circle used
     to throw off equipped items positioned in real pixels against that
     tiny container's own size (a crown that sat correctly on the real
     profile came out visibly offset here) — a picture can't have that
     problem, it's just an image. */
  .player-avatar-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .player-row-main { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .player-row-name {
    font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 14px;
    letter-spacing: 0.02em; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .player-banned-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 6px;
    font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase;
    background: rgba(240,70,70,0.16); color: #ff9d9d; border: 1px solid rgba(240,90,90,0.45);
    box-shadow: 0 0 10px rgba(240,70,70,0.2);
    white-space: nowrap;
  }
  .player-row-arrow { flex: 0 0 auto; color: var(--text-faint); font-size: 16px; }

  .players-load-more { text-align: center; margin-top: 18px; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>

<script src="../assets/js/qz-auth.js"></script>
<script src="../assets/js/qz-header-auth.js"></script>

<script src="../assets/js/site.js"></script>
<script>
(function () {
  // Live player search — debounced ~250ms so a fast typist doesn't fire a
  // database request per keystroke, and backed entirely by the
  // search_public_players() RPC (see supabase/migrations/
  // 20260906060000_players_search_and_public_profiles.sql), which already
  // excludes permanently banned, hidden, and deleted accounts server-side.
  // This page never queries public.profiles directly. Each result's
  // circle shows its chosen Profile Picture (assets/js/profile-picture-
  // picker.js) — a plain image, not a live-rendered avatar.
  const DEBOUNCE_MS = 250;
  const RESULT_LIMIT = 20;

  const input = document.getElementById('players-search-input');
  const stateEl = document.getElementById('players-state');
  const resultsEl = document.getElementById('players-results');

  let debounceTimer = null;
  let requestSeq = 0; // guards against an older, slower request overwriting a newer one

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function showState(icon, title, body) {
    stateEl.innerHTML = '<div class="icon">' + icon + '</div><strong>' + escapeHtml(title) + '</strong>' + escapeHtml(body);
    stateEl.hidden = false;
    resultsEl.hidden = true;
  }

  function renderResults(rows) {
    resultsEl.innerHTML = rows.map((row) => {
      const badge = row.is_banned
        ? '<span class="player-banned-badge">Temporarily Banned</span>'
        : '';
      const pfp = window.QZProfilePicture ? window.QZProfilePicture.imgHtml(row.equipped_profile_picture_id) : '';
      return '<a class="player-row" href="index.html?player=' + encodeURIComponent(row.username) + '">' +
        '<span class="player-avatar-thumb">' + pfp + '</span>' +
        '<span class="player-row-main"><span class="player-row-name">' + escapeHtml(row.username) + '</span>' + badge + '</span>' +
        '<span class="player-row-arrow">›</span>' +
      '</a>';
    }).join('');
    stateEl.hidden = true;
    resultsEl.hidden = false;
  }

  async function runSearch(query) {
    const mySeq = ++requestSeq;
    if (!window.QZAuth || !window.QZAuth.configured || !window.QZAuth.client) {
      showState('⚠️', 'Search unavailable', 'Accounts aren’t configured on this deployment yet.');
      return;
    }
    const [{ data, error }] = await Promise.all([
      window.QZAuth.client.rpc('search_public_players', { p_query: query, p_limit: RESULT_LIMIT, p_offset: 0 }),
      window.QZProfilePicture ? window.QZProfilePicture.ready() : Promise.resolve()
    ]);
    if (mySeq !== requestSeq) return; // a newer keystroke's request already landed
    if (error) {
      showState('⚠️', 'Something went wrong', 'Could not search players right now — try again shortly.');
      return;
    }
    if (!data || !data.length) {
      showState('🚫', 'No Players Found', 'Try another username.');
      return;
    }
    renderResults(data);
  }

  input.addEventListener('input', () => {
    const q = input.value.trim();
    clearTimeout(debounceTimer);
    if (!q) {
      requestSeq++; // invalidate any in-flight request
      showState('🔎', 'Find a Player', 'Search for a Quest Zone username to view their profile.');
      return;
    }
    debounceTimer = setTimeout(() => runSearch(q), DEBOUNCE_MS);
  });

  // ===== Top 3 Total Level showcase =====
  // Backed by get_top_total_level_players() (see supabase/migrations/
  // 20260906120000_top_total_level_players.sql), which follows the exact
  // same account-visibility rules as search_public_players() above
  // (permanently banned / hidden / test accounts excluded; temporarily
  // banned accounts included, with is_banned so the same badge can show)
  // and computes Total Level generically from every public.games row —
  // nothing here hardcodes a skill list, so it keeps working as more
  // skills are added. Clicking a card opens the same public read-only
  // profile as a normal search result (profile/index.html?player=...).
  const CROWNS = { 1: '👑', 2: '🥈', 3: '🥉' };

  function renderTop3(rows) {
    const wrap = document.getElementById('players-top3-wrap');
    const el = document.getElementById('players-top3');
    if (!rows || !rows.length) { wrap.hidden = true; return; }
    el.innerHTML = rows.map((row) => {
      const pfp = window.QZProfilePicture ? window.QZProfilePicture.imgHtml(row.equipped_profile_picture_id) : '';
      const badge = row.is_banned ? '<span class="top3-banned-badge">Temporarily Banned</span>' : '';
      return '<a class="top3-card" data-rank="' + row.rank + '" href="index.html?player=' + encodeURIComponent(row.username) + '">' +
        '<span class="top3-crown">' + (CROWNS[row.rank] || '') + '</span>' +
        '<span class="top3-rank-label">#' + row.rank + '</span>' +
        '<span class="top3-avatar-frame">' + pfp + '</span>' +
        '<span class="top3-name">' + escapeHtml(row.username) + '</span>' +
        '<span class="top3-level">Total Level: <strong>' + row.total_level + '</strong></span>' +
        badge +
      '</a>';
    }).join('');
    wrap.hidden = false;
  }

  async function loadTop3() {
    if (!window.QZAuth || !window.QZAuth.configured || !window.QZAuth.client) return;
    const [{ data, error }] = await Promise.all([
      window.QZAuth.client.rpc('get_top_total_level_players', { p_limit: 3 }),
      window.QZProfilePicture ? window.QZProfilePicture.ready() : Promise.resolve()
    ]);
    if (error) { console.warn('Players: could not load Top 3', error); return; }
    renderTop3(data);
  }

  loadTop3();
})();
</script>
