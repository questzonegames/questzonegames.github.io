<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Creation — Quest Zone</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  main.customise { padding: 26px 0 50px; position: relative; z-index: 1; }

  .cc-frame {
    position: relative;
    border: 3px solid transparent;
    border-radius: 16px;
    padding: 30px clamp(16px, 3vw, 40px) 36px;
    background: var(--qp-fill) padding-box, var(--chrome-frame) border-box;
  }
  .cc-frame::after {
    content: '';
    position: absolute; left: 8%; right: 8%; bottom: -3px; height: 2px;
    background: var(--edge-blue);
    box-shadow: 0 0 14px 2px rgba(90,180,255,0.5);
    pointer-events: none;
  }

  .cc-top {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    margin: 0 0 clamp(18px, 2.6vw, 28px);
  }
  .cc-back-btn, .cc-top-spacer { flex: 0 0 auto; min-width: 118px; }
  .cc-top-spacer { visibility: hidden; }
  .cc-heading {
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 18px;
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-style: italic;
    font-size: clamp(18px, 2.8vw, 28px); letter-spacing: 0.1em; text-align: center; margin: 0;
    background: linear-gradient(180deg, #ffffff 0%, #cfd9ee 40%, #93a3c4 60%, #eef3fc 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 18px rgba(120,170,255,0.6), 0 2px 1px rgba(0,0,0,0.6);
  }
  .cc-heading .dash {
    flex: 1 1 60px; max-width: 90px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--blue-light), transparent);
    box-shadow: 0 0 8px rgba(120,170,255,0.6); opacity: 0.9;
  }

  .inv-state {
    max-width: 480px; margin: 30px auto; text-align: center;
    color: var(--text-dim); font-size: 13.5px; line-height: 1.6;
  }
  .inv-state .icon { font-size: 32px; margin-bottom: 12px; filter: drop-shadow(0 0 14px rgba(120,170,255,0.45)); }
  .inv-state .btn { margin-top: 14px; }

  .cc-grid {
    display: grid;
    grid-template-columns: minmax(200px, 260px) minmax(220px, 340px) minmax(200px, 260px);
    gap: clamp(14px, 2vw, 22px);
    align-items: start;
  }

  .cc-panel {
    position: relative;
    border: 2px solid transparent; border-radius: 11px;
    padding: 16px 16px 18px;
    background:
      radial-gradient(ellipse at 50% 120%, rgba(60,130,255,0.08), transparent 60%),
      linear-gradient(165deg, #0e1a30 0%, #081020 60%, #060b16 100%) padding-box,
      var(--chrome-frame-soft) border-box;
  }
  .cc-panel-title {
    font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 12px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--blue-light);
    margin: 0 0 14px; text-align: center;
  }

  .cc-row { margin-bottom: 14px; }
  .cc-row:last-child { margin-bottom: 0; }
  .cc-row-label {
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim);
    margin-bottom: 6px; text-align: center;
  }
  .cc-cycler { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
  .cc-cycler-value {
    text-align: center; font-family: 'Orbitron', sans-serif; font-size: 12.5px; color: #fff;
    padding: 8px 6px; border-radius: 7px;
    background: rgba(6,10,20,0.6); border: 1px solid rgba(120,160,220,0.25);
  }
  .cc-arrow {
    width: 30px; height: 30px; flex: none; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid rgba(140,195,255,0.4);
    background: linear-gradient(180deg, rgba(20,32,56,0.9) 0%, rgba(6,10,20,0.9) 100%);
    color: #cfe0ff; transition: transform 0.12s ease, box-shadow 0.2s ease;
  }
  .cc-arrow svg { width: 14px; height: 14px; }
  .cc-arrow:hover:not(:disabled) { box-shadow: 0 0 12px rgba(90,170,255,0.5); transform: scale(1.06); }
  .cc-arrow:disabled { opacity: 0.3; cursor: default; }

  .cc-avatar-col { display: flex; flex-direction: column; align-items: center; }
  .cc-avatar-stage {
    position: relative; width: 100%; aspect-ratio: 3 / 4;
    border: 2px solid transparent; border-radius: 11px;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(70,140,255,0.2), transparent 60%),
      radial-gradient(circle at 30% 15%, rgba(255,255,255,0.06), transparent 40%),
      linear-gradient(180deg, #060b16 0%, #030509 100%) padding-box,
      var(--chrome-frame-soft) border-box;
    overflow: hidden;
  }
  .cc-avatar-stage::after {
    content: ''; position: absolute; left: 12%; right: 12%; bottom: -2px; height: 2px;
    background: var(--edge-blue); box-shadow: 0 0 12px 2px rgba(90,180,255,0.55); pointer-events: none;
  }
  .avatar-3d { position: absolute; inset: 0; z-index: 2; cursor: grab; touch-action: none; }
  .avatar-3d.dragging { cursor: grabbing; }
  .avatar-sprite {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    padding: 9% 11% 5%; filter: drop-shadow(0 0 18px rgba(90,150,255,0.35));
    pointer-events: none; user-select: none; -webkit-user-drag: none;
  }
  .avatar-equip-layer {
    /* top/width are set inline by avatar-viewer.js from its single
       EQUIP_POSITIONS table (gender-aware) — not here, so there's exactly
       one place this data lives instead of three drifting copies */
    position: absolute; left: 50%; height: auto; transform: translateX(-50%);
    pointer-events: none; user-select: none; -webkit-user-drag: none;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5)) drop-shadow(0 0 9px rgba(255,210,90,0.3));
  }
  .avatar-arrow {
    position: absolute; top: 50%; z-index: 3; width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid transparent; border-radius: 50%; cursor: pointer;
    background-image:
      linear-gradient(180deg, rgba(9,13,24,0.82) 0%, rgba(4,6,12,0.88) 100%),
      linear-gradient(135deg, #e9eefa 0%, #8ea3c9 16%, #3a4258 38%, #1a1d28 50%, #6f9fdc 62%, #263049 78%, #cdd7ea 100%);
    background-clip: padding-box, border-box; background-origin: padding-box, border-box;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 2px 8px rgba(0,0,0,0.55), 0 0 10px rgba(70,130,255,0.2);
    color: #cfe0ff; transition: transform 0.12s ease, box-shadow 0.2s ease, color 0.2s ease;
  }
  .avatar-arrow svg { width: 16px; height: 16px; }
  .avatar-arrow-left { left: 6px; transform: translateY(-50%); }
  .avatar-arrow-right { right: 6px; transform: translateY(-50%); }
  .avatar-arrow:hover {
    color: #fff; transform: translateY(-50%) scale(1.08);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 2px 10px rgba(0,0,0,0.6), 0 0 18px rgba(100,160,255,0.55);
  }

  .cc-gender-box { margin-top: 14px; }
  .cc-gender-toggle { display: flex; gap: 8px; }
  .cc-gender-btn {
    flex: 1; padding: 10px 8px; border-radius: 8px; cursor: pointer;
    font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 0.05em;
    border: 1.5px solid rgba(120,160,220,0.3);
    background: rgba(4,8,16,0.5); color: var(--text-dim);
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .cc-gender-btn:hover { color: var(--text); border-color: rgba(150,200,255,0.5); }
  .cc-gender-btn.active {
    color: #fff; border-color: var(--blue-light);
    background: linear-gradient(180deg, rgba(59,130,246,0.28) 0%, rgba(28,58,143,0.35) 100%);
    box-shadow: 0 0 14px rgba(70,140,255,0.4);
  }
  .cc-gender-btn:disabled {
    cursor: default; opacity: 0.45;
  }
  .cc-gender-btn:disabled:hover { color: var(--text-dim); border-color: rgba(120,160,220,0.3); }

  .cc-confirm-row { margin-top: clamp(18px, 2.6vw, 26px); display: flex; justify-content: center; }
  .cc-confirm-btn {
    padding: 13px 60px; border-radius: 10px; cursor: pointer;
    font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.1em;
    color: #fff; border: 1.5px solid rgba(150,200,255,0.6);
    background: linear-gradient(180deg, #3b6fe0 0%, #1c3a8f 100%);
    box-shadow: 0 0 20px rgba(70,140,255,0.4);
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .cc-confirm-btn:hover { filter: brightness(1.15); }
  .cc-confirm-btn:active { transform: scale(0.98); }
  .cc-confirm-btn:disabled { opacity: 0.6; cursor: default; }

  .cc-note {
    text-align: center; font-size: 11.5px; color: var(--text-dim);
    margin-top: 16px; line-height: 1.6; max-width: 520px; margin-left: auto; margin-right: auto;
  }

  @media (max-width: 860px) {
    .cc-grid { grid-template-columns: 1fr; }
    .cc-avatar-col { order: -1; max-width: 320px; margin: 0 auto 18px; }
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>

<script src="../assets/js/site.js"></script>

<script type="module" src="../assets/js/avatar-viewer.js"></script>
<script type="module">
  // ===== Character Creation =====
  // Each Design/Colour row is driven directly by assets/js/character-data.js's
  // option lists — today those lists hold exactly one entry each (this
  // account's ONLY real choice is "Default"/"None"), so every cycler renders
  // with its arrows disabled rather than faking a working control that does
  // nothing. Adding a real second option later (a new hairstyle, a skin
  // tone) needs no change here at all — it just starts cycling.
  const OPTS = window.QZ_CHARACTER_OPTIONS;
  const stateEl = document.getElementById('cc-state');
  const contentEl = document.getElementById('cc-content');

  function setState(html) { stateEl.innerHTML = html; stateEl.hidden = false; contentEl.hidden = true; }

  let uid = null;
  let client = null;
  let avatar = null;
  let current = { gender: 'male', hair_style: 'default', hair_colour: 'default', beard_style: 'none', beard_colour: 'default', skin_colour: 'normal' };

  // ---- generic cycler ----
  function svgArrow(dir) {
    const d = dir === 'left' ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>';
  }

  function renderCycler(containerId, options, currentKey, onChange) {
    const root = document.getElementById(containerId);
    const idx = Math.max(0, options.findIndex((o) => o.key === currentKey));
    const opt = options[idx] || options[0];
    const disabled = options.length <= 1;

    root.innerHTML =
      '<button type="button" class="cc-arrow" data-dir="prev"' + (disabled ? ' disabled' : '') + '>' + svgArrow('left') + '</button>' +
      '<div class="cc-cycler-value">' + (opt ? opt.label : '—') + '</div>' +
      '<button type="button" class="cc-arrow" data-dir="next"' + (disabled ? ' disabled' : '') + '>' + svgArrow('right') + '</button>';

    if (disabled) return;
    root.querySelector('[data-dir="prev"]').addEventListener('click', () => {
      const i = (idx - 1 + options.length) % options.length;
      onChange(options[i].key);
    });
    root.querySelector('[data-dir="next"]').addEventListener('click', () => {
      const i = (idx + 1) % options.length;
      onChange(options[i].key);
    });
  }

  // a hair/beard/skin choice that only exists for the OTHER gender (e.g.
  // male's "Black" skin tone) isn't valid here — fall back to that list's
  // first real option instead of carrying over a key this gender has no
  // art for. Also normalizes current.* itself, not just what's displayed —
  // so a stale/no-longer-valid saved value can never look selected in the
  // cycler while actually being a different value underneath.
  function normalizeForGender(gender) {
    const hairList = OPTS.hairstyles[gender] || [];
    const beardList = OPTS.beards[gender] || [];
    const skinList = OPTS.skinColours[gender] || [];
    if (!hairList.some((o) => o.key === current.hair_style)) current.hair_style = hairList[0] ? hairList[0].key : 'default';
    if (!beardList.some((o) => o.key === current.beard_style)) current.beard_style = beardList[0] ? beardList[0].key : 'none';
    if (!skinList.some((o) => o.key === current.skin_colour)) current.skin_colour = skinList[0] ? skinList[0].key : 'default';
  }

  function renderAll() {
    renderCycler('cc-hairstyle-cycler', OPTS.hairstyles[current.gender] || [], current.hair_style, (key) => {
      current.hair_style = key; renderAll();
    });
    renderCycler('cc-beard-cycler', OPTS.beards[current.gender] || [], current.beard_style, (key) => {
      current.beard_style = key; renderAll();
    });
    renderCycler('cc-skin-cycler', OPTS.skinColours[current.gender] || [], current.skin_colour, (key) => {
      current.skin_colour = key; renderAll();
    });
    renderCycler('cc-haircolour-cycler', OPTS.hairColours, current.hair_colour, (key) => {
      current.hair_colour = key; renderAll();
    });
    renderCycler('cc-beardcolour-cycler', OPTS.beardColours, current.beard_colour, (key) => {
      current.beard_colour = key; renderAll();
    });

    const genderRoot = document.getElementById('cc-gender-toggle');
    genderRoot.innerHTML = '';
    OPTS.genders.forEach((g) => {
      // a gender with no real skin-tone art yet (currently female) is
      // shown but not selectable — same "only real options are ever
      // clickable" rule as the Design/Colour cyclers, rather than letting
      // it be picked and silently fall back to a different gender's body
      const hasRealArt = (OPTS.skinColours[g.key] || []).length > 0;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cc-gender-btn' + (current.gender === g.key ? ' active' : '');
      btn.textContent = g.label + (hasRealArt ? '' : ' (Coming Soon)');
      if (!hasRealArt) {
        btn.disabled = true;
      } else {
        btn.addEventListener('click', () => {
          current.gender = g.key;
          normalizeForGender(g.key);
          renderAll();
        });
      }
      genderRoot.appendChild(btn);
    });

    if (avatar) avatar.setBaseAppearance(current.gender, current.skin_colour);
  }

  async function mountAvatar() {
    const container = document.getElementById('cc-avatar-3d');
    if (!container || !window.QZAvatarViewer) return;
    avatar = window.QZAvatarViewer.mount(container);
    avatar.setBaseAppearance(current.gender, current.skin_colour);
    document.getElementById('cc-arrow-left').addEventListener('click', () => avatar && avatar.prev());
    document.getElementById('cc-arrow-right').addEventListener('click', () => avatar && avatar.next());

    // show real equipped items on the preview, same as everywhere else the
    // avatar renders, so this looks like YOUR avatar, not a blank default
    const { data } = await client.from('equipped_items').select('slot,item_id').eq('user_id', uid);
    const catalogById = {};
    (window.QZ_ITEM_CATALOG || []).forEach((it) => { catalogById[it.id] = it; });
    const equipped = {};
    (data || []).forEach((row) => { if (row.item_id && catalogById[row.item_id]) equipped[row.slot] = catalogById[row.item_id]; });
    avatar.setAvatarEquipment(equipped);
  }

  async function init() {
    if (!window.QZAuth || !window.QZAuth.configured) {
      setState('<div class="icon">⚠️</div>Accounts aren’t configured on this deployment yet.');
      return;
    }
    const session = await window.QZAuth.getSession();
    if (!session) {
      setState('<div class="icon">🔒</div>Log in to customise your character.<br><br><a class="btn btn-chrome-blue" href="../login.html">Log In</a>');
      return;
    }
    client = window.QZAuth.client;
    uid = session.user.id;

    const { data, error } = await client.from('avatar_customization').select('*').eq('user_id', uid).single();
    if (error && error.code !== 'PGRST116') {
      setState('<div class="icon">⚠️</div>Could not load your character: ' + error.message);
      return;
    }
    if (data) {
      current = {
        gender: data.gender, hair_style: data.hair_style, hair_colour: data.hair_colour,
        beard_style: data.beard_style, beard_colour: data.beard_colour, skin_colour: data.skin_colour
      };
    }
    // a previously-saved choice (or a fresh default row) can point at an
    // option that no longer exists for this gender — e.g. 'default' skin
    // colour used to be the only option, now male only offers black/pale.
    // Normalize it to a real option BEFORE first render, so the cycler's
    // displayed value and current.* always genuinely agree with each other.
    normalizeForGender(current.gender);

    renderAll();
    await mountAvatar();

    const noteEl = document.getElementById('cc-note');
    noteEl.textContent = 'More hairstyles, beards, and skin tones are on the way — your choice here is saved and will update automatically once they’re added.';

    const confirmBtn = document.getElementById('cc-confirm-btn');
    confirmBtn.addEventListener('click', async () => {
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Saving…';
      const { error: saveErr } = await client.from('avatar_customization').upsert({
        user_id: uid,
        gender: current.gender,
        hair_style: current.hair_style,
        hair_colour: current.hair_colour,
        beard_style: current.beard_style,
        beard_colour: current.beard_colour,
        skin_colour: current.skin_colour,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' });
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Confirm';
      if (saveErr) { window.alert('Could not save: ' + saveErr.message); return; }
      if (window.qzToast) window.qzToast('Character saved!');
      location.href = 'index.html';
    });

    stateEl.hidden = true;
    contentEl.hidden = false;
  }

  // Never leave the page stuck on "Loading…" — if anything above throws
  // (a bad equipped item, a bug, a dropped request), surface it instead of
  // silently hanging forever with no visible explanation.
  init().catch((err) => {
    console.error('Character Creation failed to load:', err);
    setState('<div class="icon">⚠️</div>Something went wrong loading your character.<br><br><a class="btn btn-chrome-blue" href="index.html">‹ Back to Profile</a>');
  });
</script>
</body>
</html>
