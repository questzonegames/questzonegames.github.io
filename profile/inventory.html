<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory — Quest Zone</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  main.armory { padding: 26px 0 50px; position: relative; z-index: 1; }

  .armory-frame {
    position: relative;
    border: 3px solid transparent;
    border-radius: 16px;
    padding: 30px clamp(16px, 3vw, 36px) 36px;
    background: var(--qp-fill) padding-box, var(--chrome-frame) border-box;
  }
  .armory-frame::after {
    content: '';
    position: absolute;
    left: 8%; right: 8%; bottom: -3px;
    height: 2px;
    background: var(--edge-blue);
    filter: blur(0.5px);
    box-shadow: 0 0 14px 2px rgba(90,180,255,0.5);
    pointer-events: none;
  }

  /* ---------- top bar: back button + heading ---------- */
  .armory-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin: 0 0 clamp(18px, 2.6vw, 28px);
  }
  .armory-back-btn, .armory-top-spacer { flex: 0 0 auto; min-width: 118px; }
  .armory-top-spacer { visibility: hidden; }
  .armory-heading {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-style: italic;
    font-size: clamp(20px, 3vw, 30px);
    letter-spacing: 0.12em;
    text-align: center;
    margin: 0;
    background: linear-gradient(180deg, #ffffff 0%, #cfd9ee 40%, #93a3c4 60%, #eef3fc 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 18px rgba(120,170,255,0.6), 0 2px 1px rgba(0,0,0,0.6);
  }
  .armory-heading .dash {
    flex: 1 1 60px;
    max-width: 90px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--blue-light), transparent);
    box-shadow: 0 0 8px rgba(120,170,255,0.6);
    opacity: 0.9;
  }

  /* ---------- three-column layout ---------- */
  .armory-grid {
    display: grid;
    grid-template-columns: minmax(240px, 340px) minmax(220px, 280px) 1fr;
    gap: clamp(14px, 2vw, 22px);
    align-items: stretch;
  }

  /* ---- avatar column ---- */
  .armory-avatar-col { display: flex; flex-direction: column; align-items: center; }
  .armory-avatar-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    border: 2px solid transparent;
    border-radius: 11px;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(70,140,255,0.2), transparent 60%),
      radial-gradient(circle at 30% 15%, rgba(255,255,255,0.06), transparent 40%),
      repeating-linear-gradient(115deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 5px),
      linear-gradient(180deg, #060b16 0%, #030509 100%) padding-box,
      var(--chrome-frame-soft) border-box;
    overflow: hidden;
  }
  .armory-avatar-stage::after {
    content: '';
    position: absolute; left: 12%; right: 12%; bottom: -2px; height: 2px;
    background: var(--edge-blue);
    box-shadow: 0 0 12px 2px rgba(90,180,255,0.55);
    pointer-events: none;
  }
  .armory-avatar-name {
    margin-top: 12px;
    font-family: 'Orbitron', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.03em;
    background: linear-gradient(180deg, #fff 0%, #cfd9ee 55%, #9aa9c8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 10px rgba(120,170,255,0.35);
  }

  /* ---- avatar viewer component (duplicated from profile/index.html so
     this page never depends on profile's markup/CSS staying identical —
     it reuses the SAME avatar-viewer.js module and image assets, just
     its own local styling for the moving pieces) ---- */
  .avatar-3d {
    position: absolute;
    inset: 0;
    z-index: 2;
    cursor: grab;
    touch-action: none;
  }
  .avatar-3d.dragging { cursor: grabbing; }
  .avatar-sprite {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 9% 11% 5%;
    filter: drop-shadow(0 0 18px rgba(90,150,255,0.35));
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  /* Equipped-item art (currently just the head slot) — sized and
     positioned independently of the base sprite's object-fit box so it
     can sit right on the head instead of being scaled to fill the whole
     avatar box. Same position for all 4 directions: the hairline sits at
     a very similar height across front/right/back/left once cropped, so
     one placement reads correctly at every angle without per-direction
     tuning. */
  .avatar-equip-layer {
    position: absolute;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .avatar-equip-head {
    top: 6.3%;
    left: 50%;
    width: 17%;
    height: auto;
    transform: translateX(-50%);
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5)) drop-shadow(0 0 9px rgba(255,210,90,0.3));
  }

  .avatar-arrow {
    position: absolute;
    top: 50%;
    z-index: 3;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid transparent;
    border-radius: 50%;
    cursor: pointer;
    background-image:
      linear-gradient(180deg, rgba(9,13,24,0.82) 0%, rgba(4,6,12,0.88) 100%),
      linear-gradient(135deg, #e9eefa 0%, #8ea3c9 16%, #3a4258 38%, #1a1d28 50%, #6f9fdc 62%, #263049 78%, #cdd7ea 100%);
    background-clip: padding-box, border-box;
    background-origin: padding-box, border-box;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.14),
      0 2px 8px rgba(0,0,0,0.55),
      0 0 10px rgba(70,130,255,0.2);
    color: #cfe0ff;
    transition: transform 0.12s ease, box-shadow 0.2s ease, color 0.2s ease;
  }
  .avatar-arrow svg { width: 17px; height: 17px; }
  .avatar-arrow-left { left: 6px; transform: translateY(-50%); }
  .avatar-arrow-right { right: 6px; transform: translateY(-50%); }
  .avatar-arrow:hover {
    color: #fff;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.22),
      0 2px 10px rgba(0,0,0,0.6),
      0 0 18px rgba(100,160,255,0.55);
    transform: translateY(-50%) scale(1.08);
  }
  .avatar-arrow:active { transform: translateY(-50%) scale(0.94); }
  .avatar-arrow:focus-visible { outline: 2px solid #6fb2ff; outline-offset: 2px; }

  .avatar-loadout {
    position: absolute;
    left: 50%;
    bottom: 4%;
    z-index: 3;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    pointer-events: none;
  }
  .avatar-loadout-chip {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    border-radius: 50%;
    background: rgba(6,10,20,0.75);
    border: 1px solid rgba(140,195,255,0.45);
    box-shadow: 0 0 8px rgba(70,140,255,0.35);
  }

  /* ---- worn equipment column ---- */
  .worn-panel, .inventory-panel {
    position: relative;
    display: flex;
    flex-direction: column;
    border: 2px solid transparent;
    border-radius: 11px;
    padding: 16px 16px 18px;
    background:
      radial-gradient(ellipse at 50% 120%, rgba(60,130,255,0.08), transparent 60%),
      linear-gradient(165deg, #0e1a30 0%, #081020 60%, #060b16 100%) padding-box,
      var(--chrome-frame-soft) border-box;
  }
  .worn-panel-title, .inventory-panel-title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 14px;
    text-align: center;
  }

  /* OSRS-style equipment map: Head alone on top, three 3-across rows
     of related slots, Legs alone, Boots/Accessory at the bottom — a
     compact silhouette-of-a-body arrangement instead of a plain grid. */
  .worn-equipment {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-areas:
      ".    head    ."
      "back neck    gloves"
      "main body    off"
      ".    legs    ."
      "boots .      acc";
    gap: 8px;
  }
  .worn-slot[data-slot="head"]      { grid-area: head; }
  .worn-slot[data-slot="back"]      { grid-area: back; }
  .worn-slot[data-slot="necklace"]  { grid-area: neck; }
  .worn-slot[data-slot="gloves"]    { grid-area: gloves; }
  .worn-slot[data-slot="mainHand"]  { grid-area: main; }
  .worn-slot[data-slot="body"]      { grid-area: body; }
  .worn-slot[data-slot="offHand"]   { grid-area: off; }
  .worn-slot[data-slot="legs"]      { grid-area: legs; }
  .worn-slot[data-slot="boots"]     { grid-area: boots; }
  .worn-slot[data-slot="accessory"] { grid-area: acc; }

  .worn-slot {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px 4px;
    border-radius: 9px;
    border: 1.5px solid rgba(120,160,220,0.22);
    background:
      linear-gradient(165deg, rgba(20,32,56,0.75) 0%, rgba(6,10,20,0.85) 100%);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(90,150,255,0.06);
    min-height: 62px;
    transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.15s ease;
  }
  .worn-slot-icon { display: flex; align-items: center; justify-content: center; line-height: 1; font-size: 20px; }
  .worn-slot-empty-icon { width: 24px; height: 24px; color: rgba(130,165,215,0.38); filter: drop-shadow(0 0 3px rgba(90,150,255,0.15)); }
  .worn-slot-icon img { width: 30px; height: 30px; object-fit: contain; filter: drop-shadow(0 0 5px rgba(120,180,255,0.4)); }
  .worn-slot-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 8.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    text-align: center;
  }
  .worn-slot.filled {
    border-color: rgba(140,200,255,0.55);
    background: linear-gradient(165deg, rgba(30,46,76,0.85) 0%, rgba(8,14,26,0.9) 100%);
    box-shadow: 0 0 14px rgba(70,140,255,0.3), inset 0 0 10px rgba(70,140,255,0.12);
    cursor: pointer;
  }
  .worn-slot.filled:hover { transform: translateY(-2px); box-shadow: 0 0 18px rgba(90,170,255,0.5), inset 0 0 10px rgba(70,140,255,0.18); }

  /* ---- inventory column ---- */
  .inventory-panel { flex: 1; }
  .inv-search {
    width: 100%;
    padding: 8px 12px;
    margin-bottom: 10px;
    border-radius: 7px;
    border: 1px solid rgba(120,160,220,0.3);
    background: rgba(4,8,16,0.6);
    color: var(--text);
    font-size: 12.5px;
    font-family: inherit;
  }
  .inv-search::placeholder { color: var(--text-dim); }
  .inv-search:focus { outline: none; border-color: var(--blue-light); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }

  .inv-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .inv-filter {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid rgba(120,160,220,0.3);
    background: rgba(10,16,30,0.6);
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .inv-filter:hover { color: var(--text); border-color: rgba(150,200,255,0.5); }
  .inv-filter.active {
    color: #fff;
    background: linear-gradient(180deg, #3b6fe0 0%, #1c3a8f 100%);
    border-color: rgba(150,200,255,0.8);
    box-shadow: 0 0 12px rgba(70,140,255,0.5);
  }

  .inv-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    min-height: 160px;
  }
  .inv-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 6px 8px;
    border-radius: 9px;
    border: 1.5px solid rgba(120,160,220,0.25);
    background: linear-gradient(165deg, rgba(20,32,56,0.7) 0%, rgba(8,14,26,0.7) 100%);
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .inv-card:hover { transform: translateY(-2px); border-color: rgba(150,200,255,0.6); box-shadow: 0 6px 16px rgba(0,0,0,0.4), 0 0 14px rgba(70,140,255,0.3); }
  .inv-card-icon { font-size: 22px; line-height: 1; }
  .inv-card-icon img { width: 30px; height: 30px; object-fit: contain; filter: drop-shadow(0 0 5px rgba(120,180,255,0.35)); }
  .inv-card-name { font-size: 11px; text-align: center; line-height: 1.25; }
  .inv-card-slot { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .inv-card.equipped { opacity: 0.5; }
  .inv-card-tag {
    position: absolute; top: 5px; right: 5px;
    font-family: 'Orbitron', sans-serif;
    font-size: 7.5px; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 2px 5px; border-radius: 4px;
    background: rgba(59,130,246,0.25); color: var(--blue-light);
    border: 1px solid rgba(90,150,255,0.4);
  }
  .inv-card-empty {
    min-height: 66px;
    border-style: dashed;
    border-color: rgba(120,160,220,0.14);
    background: rgba(10,16,28,0.35);
    cursor: default;
  }
  .inv-card-empty:hover { transform: none; box-shadow: none; border-color: rgba(120,160,220,0.14); }

  .inv-pagination { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px; }
  .inv-page {
    font-family: 'Orbitron', sans-serif;
    font-size: 10.5px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid rgba(120,160,220,0.3);
    background: rgba(10,16,30,0.6);
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .inv-page:hover { color: var(--text); border-color: rgba(150,200,255,0.5); }
  .inv-page.active {
    color: #fff;
    background: linear-gradient(180deg, #3b6fe0 0%, #1c3a8f 100%);
    border-color: rgba(150,200,255,0.8);
    box-shadow: 0 0 10px rgba(70,140,255,0.45);
  }
  .inv-page-more { letter-spacing: 0.1em; }

  /* ---- floating overlays: context menu / examine / page-jump ---- */
  .qz-context-menu, .qz-examine, .qz-page-jump {
    position: fixed;
    z-index: 500;
    min-width: 140px;
    padding: 6px;
    border-radius: 9px;
    border: 1.5px solid rgba(140,195,255,0.4);
    background: linear-gradient(165deg, #101a30 0%, #060b16 100%);
    box-shadow: 0 10px 26px rgba(0,0,0,0.55), 0 0 20px rgba(60,140,255,0.25);
  }
  .qz-context-menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .qz-context-menu button:hover { background: rgba(59,130,246,0.22); color: #fff; }

  .qz-examine { padding: 14px 16px; text-align: center; min-width: 160px; }
  .qz-examine-icon { font-size: 28px; margin-bottom: 6px; }
  .qz-examine-name { font-family: 'Orbitron', sans-serif; font-size: 13px; color: var(--text); margin-bottom: 3px; }
  .qz-examine-slot { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .qz-examine-tag {
    display: inline-block; margin-top: 8px;
    font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 5px;
    background: rgba(59,130,246,0.22); color: var(--blue-light);
  }

  .qz-page-jump { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 190px; }
  .qz-page-jump label { font-size: 10.5px; color: var(--text-dim); }
  .qz-page-jump input {
    width: 100%; padding: 6px 8px; border-radius: 6px;
    border: 1px solid rgba(120,160,220,0.35); background: rgba(4,8,16,0.7);
    color: var(--text); font-size: 12.5px;
  }
  .qz-page-jump button {
    padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(150,200,255,0.5);
    background: linear-gradient(180deg, #3b6fe0 0%, #1c3a8f 100%); color: #fff;
    font-family: 'Orbitron', sans-serif; font-size: 10.5px; cursor: pointer;
  }

  @media (max-width: 1600px) {
    .armory-grid { grid-template-columns: minmax(220px, 300px) minmax(200px, 250px) 1fr; }
  }
  @media (max-width: 1366px) {
    .armory-grid { gap: 12px; }
    .inv-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 980px) {
    .armory-grid { grid-template-columns: 1fr; }
    .armory-avatar-col { max-width: 340px; margin: 0 auto; }
  }
</style>
</head>
<body>

<canvas id="site-starfield"></canvas>

<header class="site-header">
  <div class="container bar">
    <a class="logo" href="../index.html">
      <img src="../assets/img/logo.png" alt="Quest Zone">
    </a>
    <div class="site-search">
      <form action="../index.html">
        <input type="text" name="q" placeholder="Search games..." autocomplete="off">
        <button type="submit" aria-label="Search">🔍</button>
      </form>
    </div>
    <div class="header-actions">
      <a href="index.html" class="btn btn-chrome-dark">👤 Profile</a>
      <a href="#" class="btn btn-chrome-blue" data-coming-soon="Accounts are coming soon — check back later!">Signup</a>
      <a href="#" class="btn btn-chrome-dark" data-coming-soon="Accounts are coming soon — check back later!">Login</a>
    </div>
  </div>
</header>

<main class="armory">
  <div class="container">

    <div class="armory-frame bezel-lg">
      <span class="corner-brackets"><i></i><i></i><i></i><i></i></span>

      <div class="armory-top">
        <a href="index.html" class="btn btn-chrome-dark armory-back-btn">‹ Profile</a>
        <h1 class="armory-heading"><span class="dash"></span>Inventory<span class="dash"></span></h1>
        <span class="armory-top-spacer"></span>
      </div>

      <div class="armory-grid">

        <!-- Avatar -->
        <div class="armory-avatar-col">
          <div class="armory-avatar-stage bezel-sm" id="armory-avatar-stage">
            <span class="corner-brackets sm"><i></i><i></i><i></i><i></i></span>
            <div class="avatar-3d" id="armory-avatar-3d" role="img" aria-label="Your Quest Zone avatar — drag to rotate"></div>
            <button type="button" class="avatar-arrow avatar-arrow-left" id="armory-arrow-left" aria-label="Rotate avatar left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <button type="button" class="avatar-arrow avatar-arrow-right" id="armory-arrow-right" aria-label="Rotate avatar right">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
          <div class="armory-avatar-name" id="armory-username">Username</div>
        </div>

        <!-- Worn Equipment -->
        <div class="worn-panel bezel-sm">
          <span class="corner-brackets sm"><i></i><i></i><i></i><i></i></span>
          <div class="worn-panel-title">Worn Equipment</div>
          <div class="worn-equipment" id="worn-equipment"><!-- rendered by inventory.js --></div>
        </div>

        <!-- Inventory -->
        <div class="inventory-panel bezel-sm">
          <span class="corner-brackets sm"><i></i><i></i><i></i><i></i></span>
          <div class="inventory-panel-title">Inventory</div>
          <input type="text" id="inventory-search" class="inv-search" placeholder="Search inventory..." autocomplete="off">
          <div class="inv-filters" id="inventory-filters"><!-- rendered by inventory.js --></div>
          <div class="inv-grid" id="inventory-grid"><!-- rendered by inventory.js --></div>
          <div class="inv-pagination" id="inventory-pagination"><!-- rendered by inventory.js --></div>
        </div>

      </div>
    </div>

  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 Quest Zone. All rights reserved.</span>
      <span><a href="../index.html" style="color:var(--blue-light);text-decoration:none;">← Back to Quest Zone</a></span>
    </div>
  </div>
</footer>

<script src="../assets/js/starfield.js"></script>
<script src="../assets/js/site.js"></script>
<script src="../assets/js/inventory-data.js"></script>
<script src="../assets/js/avatar-viewer.js"></script>
