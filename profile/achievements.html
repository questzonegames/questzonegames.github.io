<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16.png">

<style>
  /* ===== Achievements page — full-width browser ==================
     Same component family as profile/inventory.html (search/filter bar,
     card grid, pagination, right-click context menu) just laid out full
     width instead of a narrow sidebar-plus-grid split, since this is a
     browse-everything page rather than a small personal item list. Every
     class below is prefixed ach- and scoped to this page, same
     per-page-CSS convention the rest of the site already uses. ==== */
  .ach-page { max-width: 1400px; margin: 0 auto; padding: 26px 0 60px; }
  .ach-panel {
    position: relative;
    background: var(--qp-fill);
    border-radius: 16px;
    padding: 2px;
    background: var(--chrome-frame-soft);
  }
  .ach-panel-inner {
    background: var(--qp-fill);
    border-radius: 14px;
    padding: clamp(18px, 3vw, 34px);
  }

  .ach-header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; margin-bottom: 18px; }
  .ach-header h1 {
    font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 0.04em;
    font-size: clamp(22px, 3vw, 30px); margin: 0; color: var(--text);
    text-shadow: 0 0 18px rgba(90,150,255,0.35);
  }
  .ach-summary { font-size: 13.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .ach-summary b { color: var(--blue-light); font-weight: 700; }
  .ach-summary-bar { width: 100%; height: 6px; border-radius: 4px; background: rgba(255,255,255,0.08); margin-top: 8px; overflow: hidden; }
  .ach-summary-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #7fb3ff); border-radius: 4px; transition: width 0.6s cubic-bezier(.2,.8,.2,1); }

  .ach-toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .ach-search {
    flex: 1 1 260px; padding: 10px 14px; border-radius: 8px;
    border: 1px solid rgba(120,160,220,0.3); background: rgba(4,8,16,0.6);
    color: var(--text); font-size: 13px; font-family: inherit;
  }
  .ach-search::placeholder { color: var(--text-dim); }
  .ach-search:focus { outline: none; border-color: var(--blue-light); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
  .ach-sort {
    padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(120,160,220,0.3);
    background: rgba(4,8,16,0.6); color: var(--text); font-size: 12.5px; font-family: 'Orbitron', sans-serif;
    letter-spacing: 0.03em; cursor: pointer;
  }

  .ach-filters, .ach-game-filters, .ach-tier-filters { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
  .ach-game-filters { padding-left: 4px; border-left: 2px solid rgba(120,160,220,0.25); margin-left: 2px; }
  .ach-filter {
    font-family: 'Orbitron', sans-serif; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 7px 13px; border-radius: 7px; border: 1px solid rgba(120,160,220,0.3);
    background: rgba(10,16,30,0.6); color: var(--text-dim); cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .ach-filter:hover { color: var(--text); border-color: rgba(150,200,255,0.5); }
  .ach-filter.active {
    color: #fff; background: linear-gradient(180deg, #3b6fe0 0%, #1c3a8f 100%);
    border-color: rgba(150,200,255,0.8); box-shadow: 0 0 12px rgba(70,140,255,0.5);
  }
  .ach-filter .count { opacity: 0.7; margin-left: 5px; font-weight: 400; }
  .ach-game-filters.hidden { display: none; }
  /* Second, independent filter row — status/tier (Locked, Bronze..Mythic),
     ANDed with the category row above rather than replacing it. Same
     .ach-filter chrome as the category row for visual consistency, but a
     tier chip's active state is tinted with that tier's own colour
     (set inline via --tier-chip) instead of the generic blue, so the row
     reads at a glance the way the tier panels themselves do. */
  .ach-tier-filters { padding-top: 6px; margin-top: 2px; border-top: 1px dashed rgba(120,160,220,0.18); }
  .ach-filter.tier-chip.active {
    background: linear-gradient(180deg, var(--tier-chip, #3b6fe0) 0%, rgba(0,0,0,0.35) 130%);
    border-color: var(--tier-chip, rgba(150,200,255,0.8));
    box-shadow: 0 0 12px var(--tier-chip-glow, rgba(70,140,255,0.5));
  }

  .ach-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
    min-height: 200px;
    margin-top: 6px;
  }
  /* ---- panel artwork ----
     Real image assets (assets/img/achievements/panel-<locked|tier>.png,
     see PANEL_IMAGES below), NOT CSS-drawn — one asset per tier plus a
     separate Locked asset, chosen per card by JS. Each source PNG was
     pixel-cropped to its own tight opaque bounding box (removing the
     transparent canvas margin it shipped with) so it fills this card's
     EXISTING size/shape via background-size:100% 100% with no letterboxing
     — the crop's own aspect ratio (~1.9-2:1) is already close enough to
     this card's natural rendered ratio that the resulting stretch is
     negligible; card dimensions themselves are completely unchanged from
     before this asset swap, per explicit instruction to keep the current
     size rather than resize the grid around the source art. */
  .ach-tile {
    position: relative; text-align: left; font-family: inherit;
    display: flex; flex-direction: column; gap: 6px;
    padding: 16px 16px 13px; border-radius: 12px; cursor: pointer;
    border: none;
    background-image: var(--panel-img);
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
    transition: transform 0.15s ease, filter 0.18s ease;
  }
  .ach-tile:hover { transform: translateY(-3px); filter: brightness(1.12); }
  .ach-tile.locked:hover { filter: brightness(1.08); transform: translateY(-2px); }
  /* Blank grid filler (see renderGrid's padding loop) — same Locked
     panel/size as a real card, just inert and a touch dimmer so it
     reads as "nothing here yet" rather than an actual achievement. */
  /* Grid rows stretch every item in that row to the row's tallest cell
     (CSS Grid's default align-items:stretch) — fine for a row that has
     at least one real card to set that height, but a row made ENTIRELY
     of placeholders (e.g. every row after the last real card on a short
     page) has nothing to size against, so without an explicit height
     those rows collapse down to just the empty box's own padding —
     short, wide, "squished" rectangles instead of a normal card shape.
     A fixed min-height (matched to a typical real card's rendered
     height) keeps every placeholder row the same size as a real one,
     regardless of whether that particular row has any real card in it. */
  .ach-tile-placeholder { cursor: default; opacity: 0.5; min-height: 112px; }
  .ach-tile-placeholder:hover { transform: none; filter: none; }
  .ach-tile.pinned::before {
    content: '📌'; position: absolute; top: 8px; right: 9px; font-size: 12px; opacity: 0.9;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
  }
  .ach-tile-top { display: flex; align-items: center; gap: 10px; }
  .ach-tile-icon {
    width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    background: rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.1);
  }
  /* Real badge art (e.g. Jack of All Trades) — scaled down to fit this
     box, aspect ratio preserved, never stretched/cropped. */
  .ach-tile-icon.has-img { padding: 3px; }
  .ach-tile-icon.has-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .ach-tile.locked .ach-tile-icon { position: relative; }
  /* The generic dark-box-plus-🔒 overlay is for emoji icons only — an
     achievement with its own dedicated locked-state badge (icon_locked,
     rendered via has-img the same as its unlocked badge) already reads
     as locked from the art itself, so doubling up here would just hide
     that art under a second, redundant lock treatment. */
  .ach-tile.locked .ach-tile-icon:not(.has-img)::after {
    content: '🔒'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 13px; background: rgba(0,0,0,0.5); border-radius: 9px;
  }
  .ach-tile-name { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 12.5px; line-height: 1.3; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.85); }
  .ach-tile-tier { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: var(--tier-color, #d8e0f0); text-shadow: 0 1px 2px rgba(0,0,0,0.7); }
  .ach-tile-desc { font-size: 11px; color: #f0f2f8; opacity: 0.92; line-height: 1.4; flex: 1; text-shadow: 0 1px 3px rgba(0,0,0,0.75); }
  .ach-tile-meta { display: flex; justify-content: space-between; align-items: center; font-size: 9.5px; color: #eef1f8; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.04em; text-shadow: 0 1px 2px rgba(0,0,0,0.7); }
  .ach-tile-progress-track { height: 4px; border-radius: 3px; background: rgba(0,0,0,0.35); overflow: hidden; margin-top: 2px; }
  .ach-tile-progress-fill { height: 100%; background: var(--tier-color, #3b82f6); border-radius: 3px; }
  .ach-tile-empty { min-height: 92px; border: 1px dashed rgba(120,160,220,0.12); background: rgba(10,16,28,0.3); cursor: default; }
  .ach-tile-empty:hover { transform: none; filter: none; }

  .ach-empty-msg { grid-column: 1 / -1; text-align: center; padding: 40px 10px; color: var(--text-dim); }
  .ach-empty-msg .big { font-size: 34px; margin-bottom: 8px; }

  .ach-pagination { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 20px; }
  .ach-page-btn {
    font-family: 'Orbitron', sans-serif; font-size: 10.5px; padding: 7px 11px; border-radius: 6px;
    border: 1px solid rgba(120,160,220,0.3); background: rgba(10,16,30,0.6); color: var(--text-dim); cursor: pointer;
  }
  .ach-page-btn:hover { color: var(--text); border-color: rgba(150,200,255,0.5); }
  .ach-page-btn.active { color: #fff; background: linear-gradient(180deg, #3b6fe0 0%, #1c3a8f 100%); border-color: rgba(150,200,255,0.8); box-shadow: 0 0 10px rgba(70,140,255,0.45); }
  .ach-page-btn:disabled { opacity: 0.35; cursor: default; }

  /* right-click context menu — same component as profile/inventory.html */
  .qz-context-menu {
    position: fixed; z-index: 500; min-width: 170px; padding: 6px; border-radius: 9px;
    border: 1.5px solid rgba(140,195,255,0.4);
    background: linear-gradient(165deg, #101a30 0%, #060b16 100%);
    box-shadow: 0 10px 26px rgba(0,0,0,0.55), 0 0 20px rgba(60,140,255,0.25);
  }
  .qz-context-menu button {
    display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; border: none;
    background: transparent; color: var(--text); font-family: 'Orbitron', sans-serif; font-size: 11px;
    letter-spacing: 0.05em; cursor: pointer; transition: background 0.12s ease, color 0.12s ease;
  }
  .qz-context-menu button:hover { background: rgba(59,130,246,0.22); color: #fff; }
  .qz-context-menu button:disabled { opacity: 0.35; cursor: default; }
  .qz-context-menu button:disabled:hover { background: transparent; color: var(--text); }

  .ach-toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(12px);
    background: linear-gradient(165deg, #101a30 0%, #060b16 100%); border: 1.5px solid rgba(140,195,255,0.4);
    color: var(--text); padding: 10px 18px; border-radius: 9px; font-size: 12.5px; z-index: 600;
    box-shadow: 0 10px 26px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .ach-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Note: .tier-bronze..mythic (used by the inspection card's tier
     label) live centrally in site.css now, not duplicated per-page. */

  @media (max-width: 640px) {
    .ach-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  }
</style>

<script>
(function () {
  'use strict';
  const PAGE_SIZE = 18;
  const PIN_MAX = 7;

  const CATEGORY_LABELS = { all: 'All', owned: 'Owned', games: 'Games', levels: 'Levels', ranks: 'Ranks', misc: 'Miscellaneous', pinned: 'Pinned' };
  // Default-sort grouping — Games, then Levels, then Ranks, then
  // Miscellaneous, so "All" reads as tidy same-category blocks instead
  // of interleaving by the catalog's raw sort_order (which only
  // guarantees order WITHIN a category, not between them — see
  // filteredSorted()'s 'default' case).
  const CATEGORY_ORDER = { games: 0, levels: 1, ranks: 2, misc: 3 };
  // Human-readable game names for the "Games" sub-filter and card meta
  // line — keyed by the achievements.game_key label (the game's own
  // slug), NOT public.games (the skill/XP registry) — see the migration
  // comment for why those two are deliberately different things. Add a
  // new game here (and to achievement rows' game_key) and it shows up
  // automatically, no other file needs touching.
  const GAME_LABELS = { 'anagram-quest': 'Anagram Quest', 'space-snake': 'Space Snake' };

  // Status/tier filter row — Locked plus the 6 real tiers, in official
  // tier order (Bronze -> Silver -> Gold -> Platinum -> Diamond -> Mythic).
  // Independent of, and ANDed with, activeCategory/activeGame — see
  // filteredSorted(). 'locked' means "not yet unlocked, regardless of its
  // underlying tier" (matches the panel-art rule: a locked achievement
  // always shows the Locked panel no matter what tier it actually is).
  const TIER_FILTERS = ['locked', 'bronze', 'silver', 'gold', 'platinum', 'diamond', 'mythic'];

  let client = null;
  let uid = null;
  let allAchievements = [];   // raw catalog rows, enriched with unlocked/pinned/progress
  let activeCategory = 'all';
  let activeGame = null;      // sub-filter under "games"
  let activeTier = null;      // status/tier filter — null = no tier filter, 'locked', or a tier key
  let searchTerm = '';
  let sortMode = 'default';
  let currentPage = 1;
  let pinnedSlots = {};       // slot(1-7) -> achievement_id

  const $ = (id) => document.getElementById(id);
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function toast(msg) {
    const el = $('ach-toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 2400);
  }

  function requirementText(a) {
    const v = a.requirement_value;
    switch (a.requirement_type) {
      case 'game_level': return 'Reach level ' + v + (a.game_key ? ' in ' + (GAME_LABELS[a.game_key] || a.game_key) : '');
      case 'game_xp': return 'Earn ' + Number(v).toLocaleString() + ' XP' + (a.game_key ? ' in ' + (GAME_LABELS[a.game_key] || a.game_key) : '');
      case 'total_level': return 'Reach Total Level ' + v;
      case 'games_played': return 'Play ' + v + ' game' + (v === 1 ? '' : 's') + (a.game_key ? ' of ' + (GAME_LABELS[a.game_key] || a.game_key) : '');
      case 'high_score': return 'Score ' + v + ' points in a single game' + (a.game_key ? ' of ' + (GAME_LABELS[a.game_key] || a.game_key) : '');
      case 'anagram_final_rounds': return 'Solve ' + v + ' Final Round' + (v === 1 ? '' : 's') + ' in Anagram Quest';
      case 'anagram_hard_high_score': return 'Score ' + v + ' points in a single Anagram Quest game on Hard difficulty';
      case 'anagram_hard_final_round': return 'Solve the Round 5 Final Round in Anagram Quest on Hard difficulty';
      case 'anagram_perfect_game': return 'Score in every round and solve the Final Round in the same Anagram Quest game';
      default: return a.description || 'Special achievement.';
    }
  }

  // ---- data loading ----
  async function loadStats() {
    // Only the stat sources today's achievements need — add another
    // `case` here (and a matching requirement_type in the catalog +
    // achievement_requirement_met() server-side) to support a new
    // progress-trackable stat later. Keyed 'requirementType|gameKey' so
    // the same stat source can back several achievements at once.
    const stats = {};
    if (!client || !uid) return stats;
    try {
      const [{ data: gs }, { data: gp }, { data: totalLevel }, { data: aqs }] = await Promise.all([
        client.from('game_stats').select('game_key,games_played,high_score').eq('user_id', uid),
        client.from('game_progress').select('game_key,xp,level').eq('user_id', uid),
        // The SAME public.total_level() the server itself checks a
        // 'total_level' requirement against (see achievement_requirement_
        // met() in the migration) — not a client-side approximation, so
        // the Jack of All Trades progress bars can never show a number
        // that disagrees with what actually unlocks them.
        client.rpc('total_level', { p_user: uid }),
        // Anagram Quest's own stats table (final_rounds_solved/
        // hard_high_score/hard_final_round_solved/perfect_game_achieved)
        // — see supabase/migrations/20260909080000_anagram_quest_
        // achievements_v2.sql. No row yet (never played) is a normal,
        // valid state, not an error — every field below defaults to 0.
        client.from('anagram_quest_stats').select('final_rounds_solved,hard_high_score,hard_final_round_solved,perfect_game_achieved').eq('user_id', uid).maybeSingle()
      ]);
      (gs || []).forEach((row) => {
        stats['games_played|' + row.game_key] = row.games_played || 0;
        stats['high_score|' + row.game_key] = row.high_score || 0;
      });
      (gp || []).forEach((row) => {
        stats['game_xp|' + row.game_key] = row.xp || 0;
        stats['game_level|' + row.game_key] = row.level || 1;
      });
      stats['total_level|'] = typeof totalLevel === 'number' ? totalLevel : null; // null, not 0 — "can't compute yet" vs "genuinely zero"
      stats['anagram_final_rounds|'] = (aqs && aqs.final_rounds_solved) || 0;
      stats['anagram_hard_high_score|'] = (aqs && aqs.hard_high_score) || 0;
      stats['anagram_hard_final_round|'] = aqs && aqs.hard_final_round_solved ? 1 : 0;
      stats['anagram_perfect_game|'] = aqs && aqs.perfect_game_achieved ? 1 : 0;
    } catch (err) {
      console.warn('Achievements: could not load stats for progress bars', err);
    }
    return stats;
  }

  function progressFor(a, stats) {
    if (!a.requirement_type || a.requirement_value == null) return null;
    const key = a.requirement_type + '|' + (a.requirement_type === 'total_level' ? '' : (a.requirement_game_key || ''));
    const current = stats[key];
    if (current == null) return null;
    return { current: Math.min(current, a.requirement_value), max: a.requirement_value };
  }

  async function loadAll() {
    if (!window.QZAuth || !window.QZAuth.client) { renderError('Sign in to browse achievements.'); return; }
    client = window.QZAuth.client;
    const profile = await window.QZAuth.getProfile();
    uid = profile ? profile.id : null;

    // "Backtrack" pass — catches this account up on anything it already
    // qualifies for by real stats (level, games played, etc.) but never
    // got the RPC call for, e.g. an account that reached Intelligence
    // Level 25 before these achievements existed at all. Awaited so the
    // very first render already reflects it, not a laggy pop-in after.
    if (uid && window.QZAchievements) await window.QZAchievements.checkStatAchievements();

    const { data: catalog, error } = await client
      .from('achievements')
      .select('achievement_id,name,description,icon,icon_locked,tier,sort_order,category,game_key,hidden,requirement_type,requirement_game_key,requirement_value,reward_item_ids')
      .order('sort_order', { ascending: true });
    if (error || !catalog) { renderError('Could not load achievements right now.'); return; }

    let unlockedMap = {}; // id -> unlocked_at
    pinnedSlots = {};
    if (uid) {
      const [{ data: unlocked }, { data: pinned }] = await Promise.all([
        client.from('unlocked_achievements').select('achievement_id,unlocked_at').eq('user_id', uid),
        client.from('pinned_achievements').select('slot,achievement_id').eq('user_id', uid)
      ]);
      (unlocked || []).forEach((u) => { unlockedMap[u.achievement_id] = u.unlocked_at; });
      (pinned || []).forEach((p) => { if (p.achievement_id) pinnedSlots[p.slot] = p.achievement_id; });
    }
    const pinnedIds = new Set(Object.values(pinnedSlots));

    const stats = await loadStats();

    allAchievements = catalog
      .filter((a) => !a.hidden || unlockedMap[a.achievement_id]) // secret achievements only show once earned
      .map((a) => ({
        id: a.achievement_id,
        name: a.name,
        description: a.description || '',
        icon: a.icon || '🏆',
        iconLocked: a.icon_locked || null,
        rewardItemIds: a.reward_item_ids || null,
        tier: a.tier || '',
        category: a.category || 'misc',
        game_key: a.game_key || null,
        requirement_type: a.requirement_type,
        requirement_game_key: a.requirement_game_key,
        requirement_value: a.requirement_value,
        sort_order: a.sort_order || 0,
        unlocked: !!unlockedMap[a.achievement_id],
        unlockedAt: unlockedMap[a.achievement_id] || null,
        pinned: pinnedIds.has(a.achievement_id),
        progress: progressFor(a, stats)
      }));

    renderFilters();
    currentPage = 1;
    renderAll();
  }

  function renderError(msg) {
    $('ach-summary').textContent = msg;
    $('ach-grid').innerHTML = '<div class="ach-empty-msg"><div class="big">🏅</div>' + escapeHtml(msg) + '</div>';
    $('ach-pagination').innerHTML = '';
  }

  // ---- filters ----
  function renderFilters() {
    const root = $('ach-filters');
    root.innerHTML = '';
    const categories = ['all', 'owned', 'games', 'levels', 'ranks', 'misc', 'pinned'];
    categories.forEach((cat) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ach-filter' + (activeCategory === cat ? ' active' : '');
      const count = cat === 'all' ? allAchievements.length
        : cat === 'owned' ? allAchievements.filter((a) => a.unlocked).length
        : cat === 'pinned' ? allAchievements.filter((a) => a.pinned).length
        : allAchievements.filter((a) => a.category === cat).length;
      btn.innerHTML = escapeHtml(CATEGORY_LABELS[cat] || cat) + '<span class="count">' + count + '</span>';
      btn.addEventListener('click', () => {
        activeCategory = cat;
        activeGame = null;
        currentPage = 1;
        renderFilters();
        renderGameFilters();
        renderAll();
      });
      root.appendChild(btn);
    });
    renderGameFilters();
    renderTierFilters();
  }

  function renderTierFilters() {
    const root = $('ach-tier-filters');
    root.innerHTML = '';
    TIER_FILTERS.forEach((key) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      const info = key === 'locked'
        ? { label: 'Locked', color: '#9fb3d6', glow: 'rgba(159,179,214,0.5)' }
        : (window.QZAchievements ? window.QZAchievements.tierInfo(key) : { label: key, color: '#9fb3d6', glow: 'rgba(159,179,214,0.5)' });
      btn.className = 'ach-filter tier-chip' + (activeTier === key ? ' active' : '');
      btn.style.setProperty('--tier-chip', info.color);
      btn.style.setProperty('--tier-chip-glow', info.glow);
      // 'locked' is a STATUS filter (how many are currently locked, any
      // tier) — but bronze/silver/.../mythic are TIER filters (how many
      // achievements exist at that tier, locked or unlocked). Previously
      // this counted only the UNLOCKED ones for every tier, so e.g.
      // "Mythic" showed 0 (and clicking it showed "no achievements match
      // your filters") the moment nobody had unlocked a Mythic
      // achievement yet, even though several exist and are simply locked.
      const count = key === 'locked'
        ? allAchievements.filter((a) => !a.unlocked).length
        : allAchievements.filter((a) => String(a.tier || '').toLowerCase() === key).length;
      btn.innerHTML = escapeHtml(info.label) + '<span class="count">' + count + '</span>';
      btn.addEventListener('click', () => {
        activeTier = activeTier === key ? null : key; // click again to clear
        currentPage = 1;
        renderTierFilters();
        renderAll();
      });
      root.appendChild(btn);
    });
  }

  function renderGameFilters() {
    const root = $('ach-game-filters');
    if (activeCategory !== 'games') { root.classList.add('hidden'); root.innerHTML = ''; return; }
    const gameKeys = Array.from(new Set(allAchievements.filter((a) => a.category === 'games' && a.game_key).map((a) => a.game_key)));
    if (gameKeys.length === 0) { root.classList.add('hidden'); return; }
    root.classList.remove('hidden');
    root.innerHTML = '';
    const allBtn = document.createElement('button');
    allBtn.type = 'button';
    allBtn.className = 'ach-filter' + (!activeGame ? ' active' : '');
    allBtn.textContent = 'All Games';
    allBtn.addEventListener('click', () => { activeGame = null; currentPage = 1; renderGameFilters(); renderAll(); });
    root.appendChild(allBtn);
    gameKeys.forEach((gk) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ach-filter' + (activeGame === gk ? ' active' : '');
      btn.textContent = GAME_LABELS[gk] || gk;
      btn.addEventListener('click', () => { activeGame = gk; currentPage = 1; renderGameFilters(); renderAll(); });
      root.appendChild(btn);
    });
  }

  // ---- filter/search/sort pipeline ----
  function filteredSorted() {
    let list = allAchievements.slice();
    if (activeCategory === 'pinned') {
      list = list.filter((a) => a.pinned);
    } else if (activeCategory === 'owned') {
      list = list.filter((a) => a.unlocked);
    } else if (activeCategory !== 'all') {
      list = list.filter((a) => a.category === activeCategory);
      if (activeCategory === 'games' && activeGame) list = list.filter((a) => a.game_key === activeGame);
    }
    if (activeTier === 'locked') {
      list = list.filter((a) => !a.unlocked);
    } else if (activeTier) {
      // Tier filters show every achievement AT that tier regardless of
      // unlock status (matching the count above) — a locked one still
      // renders, just with its locked card styling, same as it does
      // under "All" or a category filter.
      list = list.filter((a) => String(a.tier || '').toLowerCase() === activeTier);
    }
    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      list = list.filter((a) =>
        a.name.toLowerCase().includes(q) ||
        a.description.toLowerCase().includes(q) ||
        (GAME_LABELS[a.game_key] || a.game_key || '').toLowerCase().includes(q) ||
        (CATEGORY_LABELS[a.category] || a.category || '').toLowerCase().includes(q)
      );
    }
    const tierRank = (t) => (window.QZAchievements ? window.QZAchievements.tierInfo(t).rank : 0);
    switch (sortMode) {
      case 'unlocked-first': list.sort((a, b) => (b.unlocked - a.unlocked) || (a.sort_order - b.sort_order)); break;
      case 'locked-first': list.sort((a, b) => (a.unlocked - b.unlocked) || (a.sort_order - b.sort_order)); break;
      case 'tier': list.sort((a, b) => tierRank(b.tier) - tierRank(a.tier) || (a.sort_order - b.sort_order)); break;
      case 'newest': list.sort((a, b) => {
        if (a.unlocked && b.unlocked) return new Date(b.unlockedAt) - new Date(a.unlockedAt);
        return b.unlocked - a.unlocked;
      }); break;
      case 'alpha': list.sort((a, b) => a.name.localeCompare(b.name)); break;
      default:
        // Category block (Games -> Levels -> Ranks -> Misc) first, so
        // "All" never interleaves categories; within a category, Locked
        // first then Bronze -> Mythic (tierRank, with locked forced to
        // rank 0 regardless of the achievement's real tier) so a glance
        // at any one category reads Locked, Bronze, Silver, ... Mythic;
        // sort_order is only the final tiebreak within one identical
        // category+tier bucket.
        list.sort((a, b) => {
          const catDiff = (CATEGORY_ORDER[a.category] ?? 99) - (CATEGORY_ORDER[b.category] ?? 99);
          if (catDiff) return catDiff;
          const bucketA = a.unlocked ? tierRank(a.tier) : 0;
          const bucketB = b.unlocked ? tierRank(b.tier) : 0;
          if (bucketA !== bucketB) return bucketA - bucketB;
          return a.sort_order - b.sort_order;
        });
    }
    return list;
  }

  function totalPages(list) { return Math.max(1, Math.ceil(list.length / PAGE_SIZE)); }

  function renderAll() {
    const list = filteredSorted();
    const summaryEl = $('ach-summary');
    const unlockedCount = allAchievements.filter((a) => a.unlocked).length;
    const total = allAchievements.length;
    const pct = total ? Math.round((unlockedCount / total) * 100) : 0;
    summaryEl.innerHTML = 'Achievements <b>' + unlockedCount + ' / ' + total + '</b> — <b>' + pct + '%</b> Complete';
    $('ach-summary-fill').style.width = pct + '%';

    const tp = totalPages(list);
    if (currentPage > tp) currentPage = tp;
    if (currentPage < 1) currentPage = 1;

    renderGrid(list);
    renderPagination(tp);
  }

  // ---- grid ----
  // Real panel artwork (see assets/img/achievements/panel-*.png) — chosen
  // Locked-state-first, tier second, exactly per the requested logic:
  //   if (!achievement.unlocked) panel = lockedPanel;
  //   else panel = tierPanels[achievement.tier];
  // A card's underlying tier is NEVER used to pick art while locked, only
  // to decide the panel once it's actually unlocked (see cardVars below) —
  // the tier itself still travels with the achievement data the whole
  // time (sorting/filtering by tier works on locked cards too), only the
  // ARTWORK is gated on unlocked state.
  const PANEL_IMAGES = {
    locked: '../assets/img/achievements/panel-locked.png',
    bronze: '../assets/img/achievements/panel-bronze.png',
    silver: '../assets/img/achievements/panel-silver.png',
    gold: '../assets/img/achievements/panel-gold.png',
    platinum: '../assets/img/achievements/panel-platinum.png',
    diamond: '../assets/img/achievements/panel-diamond.png',
    mythic: '../assets/img/achievements/panel-mythic.png'
  };
  function cardVars(a) {
    const panelKey = a.unlocked ? String(a.tier || '').toLowerCase() : 'locked';
    const panelUrl = PANEL_IMAGES[panelKey] || PANEL_IMAGES.locked;
    const vars = { '--panel-img': 'url(' + panelUrl + ')' };
    if (a.unlocked && window.QZAchievements) vars['--tier-color'] = window.QZAchievements.tierInfo(a.tier).color;
    return vars;
  }

  // Real badge image (e.g. the Jack of All Trades family) vs a plain
  // emoji glyph — see isImageIcon()/pickIcon() in qz-achievements.js.
  // pickIcon() always returns the achievement's real badge, locked or
  // not — only the card's PANEL (above) is locked-gated, so the badge
  // itself stays visible at a glance even on a locked card. 'has-img'
  // just suppresses the generic dark-box-plus-lock-emoji overlay
  // (.ach-tile.locked .ach-tile-icon::after), which exists for emoji
  // icons only — real badge art doesn't need a second lock indicator
  // drawn over it.
  function iconBoxHtml(a) {
    const icon = window.QZAchievements ? window.QZAchievements.pickIcon(a) : a.icon;
    const isImg = window.QZAchievements && window.QZAchievements.isImageIcon(icon);
    return '<span class="ach-tile-icon' + (isImg ? ' has-img' : '') + '">' +
      (isImg ? '<img src="' + icon + '" alt="" loading="lazy">' : escapeHtml(icon)) +
      '</span>';
  }

  function renderGrid(list) {
    const root = $('ach-grid');
    root.innerHTML = '';
    if (list.length === 0) {
      root.innerHTML = '<div class="ach-empty-msg"><div class="big">🏅</div>No achievements match your filters.</div>';
      return;
    }
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageItems = list.slice(start, start + PAGE_SIZE);

    pageItems.forEach((a) => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'ach-tile' + (a.unlocked ? '' : ' locked') + (a.pinned ? ' pinned' : '');
      const vars = cardVars(a);
      Object.keys(vars).forEach((k) => card.style.setProperty(k, vars[k]));

      const tierLabel = window.QZAchievements ? window.QZAchievements.tierInfo(a.tier).label : a.tier;
      const gameLabel = GAME_LABELS[a.game_key] || (CATEGORY_LABELS[a.category] || a.category);
      const prog = a.progress;

      card.innerHTML =
        '<div class="ach-tile-top">' +
          iconBoxHtml(a) +
          '<div style="min-width:0;">' +
            '<div class="ach-tile-name">' + escapeHtml(a.name) + '</div>' +
            '<div class="ach-tile-tier">' + escapeHtml(tierLabel) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="ach-tile-desc">' + escapeHtml(a.description) + '</div>' +
        (prog && !a.unlocked
          ? '<div class="ach-tile-progress-track"><div class="ach-tile-progress-fill" style="width:' + (100 * prog.current / prog.max).toFixed(1) + '%"></div></div>'
          : '') +
        '<div class="ach-tile-meta"><span>' + escapeHtml(gameLabel) + '</span><span>' + (a.unlocked ? 'Unlocked' : 'Locked') + '</span></div>';

      card.addEventListener('click', () => openDetails(a, card));
      card.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        openContextMenu(e.clientX, e.clientY, a, card);
      });
      // keyboard/touch equivalent of right-click (long-press substitute:
      // a keyboard user gets the same actions via Shift+F10/Menu key,
      // which browsers already map to a native contextmenu event on the
      // focused element — no extra code needed here beyond focusability,
      // which a <button> already has).
      root.appendChild(card);
    });

    // Pad this page out to a full PAGE_SIZE grid with blank Locked-
    // template placeholder tiles. Without this, a short page (e.g. one
    // lone achievement on the last page) sits by itself with a lot of
    // empty row around it, which reads as an odd stretched/squashed
    // card rather than a normal-sized one — filling the rest of the
    // grid with the same Locked panel every real locked card already
    // uses keeps every page looking as full and even as the first.
    // Purely cosmetic: no data, no click handler, never affects
    // filtering/search/pagination counts.
    for (let i = pageItems.length; i < PAGE_SIZE; i++) {
      const filler = document.createElement('div');
      filler.className = 'ach-tile ach-tile-placeholder';
      filler.style.setProperty('--panel-img', 'url(' + PANEL_IMAGES.locked + ')');
      filler.setAttribute('aria-hidden', 'true');
      root.appendChild(filler);
    }
  }

  function renderPagination(tp) {
    const root = $('ach-pagination');
    root.innerHTML = '';
    if (tp <= 1) return;
    const mkBtn = (label, page, opts) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ach-page-btn' + (opts && opts.active ? ' active' : '');
      btn.textContent = label;
      if (opts && opts.disabled) btn.disabled = true;
      else btn.addEventListener('click', () => { currentPage = page; renderAll(); window.scrollTo({ top: $('ach-grid').getBoundingClientRect().top + window.scrollY - 90, behavior: 'smooth' }); });
      return btn;
    };
    root.appendChild(mkBtn('‹', currentPage - 1, { disabled: currentPage <= 1 }));
    const windowSize = 5;
    let startP = Math.max(1, currentPage - Math.floor(windowSize / 2));
    let endP = Math.min(tp, startP + windowSize - 1);
    startP = Math.max(1, endP - windowSize + 1);
    for (let p = startP; p <= endP; p++) root.appendChild(mkBtn(String(p), p, { active: p === currentPage }));
    root.appendChild(mkBtn('›', currentPage + 1, { disabled: currentPage >= tp }));
  }

  // ---- details modal (extends assets/js/achievement-inspection.js) ----
  function openDetails(a, sourceEl) {
    if (!window.QZAchievementInspection) return;
    window.QZAchievementInspection.open({
      id: a.id, name: a.name, tier: a.tier || 'unranked', description: a.description, icon: a.icon, iconLocked: a.iconLocked,
      rewardItemIds: a.rewardItemIds,
      unlocked: a.unlocked, unlockedAt: a.unlockedAt, game: GAME_LABELS[a.game_key] || a.game_key,
      category: CATEGORY_LABELS[a.category] || a.category,
      requirement: requirementText(a), progress: a.progress, pinned: a.pinned,
      onPin: a.unlocked ? () => { pinAchievement(a); } : null,
      onUnpin: a.pinned ? () => { unpinAchievement(a); } : null
    }, sourceEl);
  }

  // ---- context menu ----
  let menuEl = null;
  function closeMenu() {
    if (menuEl) { menuEl.remove(); menuEl = null; }
    document.removeEventListener('pointerdown', onOutside, true);
    document.removeEventListener('keydown', onEsc, true);
  }
  function onOutside(e) { if (menuEl && !menuEl.contains(e.target)) closeMenu(); }
  function onEsc(e) { if (e.key === 'Escape') closeMenu(); }
  function openContextMenu(x, y, a, sourceEl) {
    closeMenu();
    menuEl = document.createElement('div');
    menuEl.className = 'qz-context-menu';
    const actions = [];
    if (a.unlocked) {
      if (a.pinned) {
        actions.push({ label: 'Unpin Achievement', onClick: () => unpinAchievement(a) });
      } else {
        // One "Pin in Slot N" action per FREE slot only — an already-
        // occupied slot never shows as pinnable here, so choosing a slot
        // is exactly how a player reorders their showcase: unpin the one
        // they want moved, then pin the new one into that now-free slot.
        for (let slot = 1; slot <= PIN_MAX; slot++) {
          if (pinnedSlots[slot]) continue;
          actions.push({ label: 'Pin in Slot ' + slot, onClick: () => pinAchievement(a, slot) });
        }
        if (actions.length === 0) {
          actions.push({ label: 'Pin Achievement', disabled: true, onClick: () => {} });
        }
      }
    } else {
      actions.push({ label: 'Pin Achievement', disabled: true, onClick: () => {} });
    }
    actions.push({ label: 'View Details', onClick: () => openDetails(a, sourceEl) });
    actions.forEach((act) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = act.label;
      if (act.disabled) btn.disabled = true;
      btn.addEventListener('click', () => { closeMenu(); act.onClick(); });
      menuEl.appendChild(btn);
    });
    document.body.appendChild(menuEl);
    const vw = window.innerWidth, vh = window.innerHeight;
    const rect = menuEl.getBoundingClientRect();
    menuEl.style.left = Math.max(8, Math.min(x, vw - rect.width - 8)) + 'px';
    menuEl.style.top = Math.max(8, Math.min(y, vh - rect.height - 8)) + 'px';
    setTimeout(() => {
      document.addEventListener('pointerdown', onOutside, true);
      document.addEventListener('keydown', onEsc, true);
    }, 0);
  }

  // ---- pin / unpin — writes straight to pinned_achievements (own-row
  // RLS covers this, no RPC needed — see the table's policies in
  // supabase/schema.sql). profile/index.html's own pinned-badges render
  // reads this exact table, so a pin made here shows up there next time
  // that page loads with zero extra wiring. ----
  async function pinAchievement(a, requestedSlot) {
    if (!client || !uid) { toast('Sign in to pin achievements.'); return; }
    if (!a.unlocked) return; // belt-and-suspenders — menu already hides this
    const usedSlots = Object.keys(pinnedSlots).map(Number);
    if (usedSlots.length >= PIN_MAX) { toast('You can only pin up to 7 achievements.'); return; }
    let slot = requestedSlot;
    if (!slot || pinnedSlots[slot]) {
      // No explicit slot given (e.g. the details modal's quick "Pin
      // Achievement" button), or the requested one filled in the split
      // second since the menu was opened — fall back to the first free
      // slot rather than failing outright.
      slot = 1;
      while (pinnedSlots[slot]) slot++;
    }
    const { error } = await client.from('pinned_achievements').insert({ user_id: uid, slot, achievement_id: a.id });
    if (error) { toast('Could not pin that achievement.'); return; }
    pinnedSlots[slot] = a.id;
    a.pinned = true;
    toast('Pinned "' + a.name + '".');
    renderFilters();
    renderAll();
  }
  async function unpinAchievement(a) {
    if (!client || !uid) return;
    const slot = Object.keys(pinnedSlots).find((s) => pinnedSlots[s] === a.id);
    if (slot == null) return;
    const { error } = await client.from('pinned_achievements').delete().eq('user_id', uid).eq('slot', slot);
    if (error) { toast('Could not unpin that achievement.'); return; }
    delete pinnedSlots[slot];
    a.pinned = false;
    toast('Unpinned "' + a.name + '".');
    renderFilters();
    renderAll();
  }

  // ---- toolbar wiring ----
  let searchDebounce = null;
  $('ach-search').addEventListener('input', (e) => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => { searchTerm = e.target.value.trim(); currentPage = 1; renderAll(); }, 150);
  });
  $('ach-sort').addEventListener('change', (e) => { sortMode = e.target.value; currentPage = 1; renderAll(); });

  loadAll();
})();
