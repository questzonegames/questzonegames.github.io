<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills — Quest Zone</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  main.skills-main { padding: 26px 0 50px; position: relative; z-index: 1; }

  .skills-frame {
    position: relative;
    border-radius: 18px;
    padding: 22px clamp(14px, 3vw, 28px) 0;
  }

  .skills-top {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 20px;
  }
  .skills-top .back-btn { flex: 0 0 auto; }
  .skills-heading {
    flex: 1; text-align: center;
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(22px, 4vw, 32px);
    letter-spacing: 0.08em; margin: 0;
    text-shadow: 0 0 16px rgba(120,170,255,0.5);
  }
  .skills-top-spacer { flex: 0 0 auto; width: 96px; }

  .skills-layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 780px) {
    .skills-layout { grid-template-columns: 1fr; }
  }

  /* ---- avatar column (same avatar-stage/arrow markup+behaviour as
     profile/index.html — avatar-viewer.js targets these exact classes) ---- */
  .avatar-col { display: flex; flex-direction: column; }
  .avatar-stage {
    position: relative; width: 100%; aspect-ratio: 3 / 4;
    border: 2px solid transparent; border-radius: 11px;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(70,140,255,0.2), transparent 60%),
      radial-gradient(circle at 30% 15%, rgba(255,255,255,0.06), transparent 40%),
      linear-gradient(180deg, #060b16 0%, #030509 100%) padding-box,
      var(--chrome-frame-soft) border-box;
    overflow: hidden;
  }
  .avatar-stage::after {
    content: ''; position: absolute; left: 12%; right: 12%; bottom: -2px; height: 2px;
    background: var(--edge-blue); box-shadow: 0 0 12px 2px rgba(90,180,255,0.55); pointer-events: none;
  }
  .avatar-3d { position: absolute; inset: 0; z-index: 2; cursor: grab; touch-action: none; }
  .avatar-3d.dragging { cursor: grabbing; }
  .avatar-sprite {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    padding: 9% 11% 5%; filter: drop-shadow(0 0 18px rgba(90,150,255,0.35));
    pointer-events: none; user-select: none; -webkit-user-drag: none;
  }
  .avatar-equip-layer {
    position: absolute; left: 50%; height: auto; transform: translateX(-50%);
    pointer-events: none; user-select: none; -webkit-user-drag: none;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5)) drop-shadow(0 0 9px rgba(255,210,90,0.3));
  }
  .avatar-loadout {
    position: absolute; left: 50%; bottom: 4%; z-index: 3; transform: translateX(-50%);
    display: flex; gap: 5px; pointer-events: none;
  }
  .avatar-loadout-chip {
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; border-radius: 50%; background: rgba(6,10,20,0.75);
    border: 1px solid rgba(140,195,255,0.45); box-shadow: 0 0 8px rgba(70,140,255,0.35);
  }
  .avatar-arrow {
    position: absolute; top: 50%; z-index: 3; width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid transparent; border-radius: 50%; cursor: pointer;
    background-image:
      linear-gradient(180deg, rgba(9,13,24,0.82) 0%, rgba(4,6,12,0.88) 100%),
      linear-gradient(135deg, #e9eefa 0%, #8ea3c9 16%, #3a4258 38%, #1a1d28 50%, #6f9fdc 62%, #263049 78%, #cdd7ea 100%);
    background-clip: padding-box, border-box; background-origin: padding-box, border-box;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 2px 8px rgba(0,0,0,0.55), 0 0 10px rgba(70,130,255,0.2);
    color: #cfe0ff; transition: transform 0.12s ease, box-shadow 0.2s ease, color 0.2s ease;
  }
  .avatar-arrow svg { width: 16px; height: 16px; }
  .avatar-arrow-left { left: 6px; transform: translateY(-50%); }
  .avatar-arrow-right { right: 6px; transform: translateY(-50%); }
  .avatar-arrow:hover {
    color: #fff; transform: translateY(-50%) scale(1.08);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 2px 10px rgba(0,0,0,0.6), 0 0 18px rgba(100,160,255,0.55);
  }
  .avatar-username {
    text-align: center; font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: 16px; margin-top: 12px; letter-spacing: 0.03em;
  }

  /* ---- skill grid ---- */
  /* Individual box styling (.qz-skillcard-box) and the hover tooltip
     (#qz-skillcard-tooltip) come from assets/js/skill-card.js, shared with
     the Anagram Quest lobby — only the grid layout itself lives here. */
  .skill-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  @media (max-width: 560px) {
    .skill-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .total-level-bar {
    margin: 18px 0 22px;
    text-align: center; padding: 14px;
    border-top: 1px solid rgba(110,150,220,0.3);
    font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: 0.04em;
  }
  .total-level-bar .num { color: var(--blue-light); font-weight: 900; margin-left: 8px; }
</style>
</head>
<body>

<canvas id="site-starfield"></canvas>

<header class="site-header">
  <div class="container bar">
    <a class="logo" href="../index.html">
      <img src="../assets/img/logo.png" alt="Quest Zone">
    </a>
    <div class="site-search">
      <form action="../index.html">
        <input type="text" name="q" placeholder="Search games..." autocomplete="off">
        <button type="submit" aria-label="Search">🔍</button>
      </form>
    </div>
    <div class="header-actions">
      <a href="index.html" class="btn btn-chrome-dark">👤 Profile</a>
      <a href="#" class="btn btn-chrome-blue" data-coming-soon="Accounts are coming soon — check back later!">Signup</a>
      <a href="#" class="btn btn-chrome-dark" data-coming-soon="Accounts are coming soon — check back later!">Login</a>
    </div>
  </div>
</header>

<main class="skills-main">
  <div class="container">
    <div class="skills-frame panel bezel-lg">
      <span class="corner-brackets"><i></i><i></i><i></i><i></i></span>

      <div class="skills-top">
        <a href="index.html" class="btn btn-chrome-dark back-btn">← Profile</a>
        <h1 class="skills-heading">Skills</h1>
        <span class="skills-top-spacer"></span>
      </div>

      <div class="skills-layout">
        <div class="avatar-col">
          <div class="avatar-stage bezel-sm" id="avatar-stage">
            <span class="corner-brackets sm"><i></i><i></i><i></i><i></i></span>
            <div class="avatar-3d" id="avatar-3d" role="img" aria-label="Your Quest Zone avatar — drag to rotate"></div>
            <button type="button" class="avatar-arrow avatar-arrow-left" id="avatar-arrow-left" aria-label="Rotate avatar left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <button type="button" class="avatar-arrow avatar-arrow-right" id="avatar-arrow-right" aria-label="Rotate avatar right">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
          <div class="avatar-username" id="skills-username">Username</div>
        </div>

        <div>
          <div class="skill-grid" id="skill-grid"><!-- 24 skill boxes, rendered from public.games + game_progress --></div>
          <div class="total-level-bar">TOTAL LEVEL:<span class="num" id="total-level-value">—</span></div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 Quest Zone. All rights reserved.</span>
      <span><a href="../index.html" style="color:var(--blue-light);text-decoration:none;">← Back to Quest Zone</a></span>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="../assets/js/qz-config.js"></script>
<script src="../assets/js/qz-auth.js"></script>
<script src="../assets/js/qz-header-auth.js"></script>
<script src="../assets/js/qz-xp.js"></script>
<script src="../assets/js/inventory-data.js"></script>
<script src="../assets/js/item-notify.js"></script>
<script src="../assets/js/starfield.js"></script>
<script src="../assets/js/site.js"></script>
<script src="../assets/js/avatar-viewer.js"></script>
<script src="../assets/js/skill-card.js"></script>
<script>
(function () {
  // Skill icons — keyed by games.game_key. A game_key with no entry here
  // just shows its level (no name/icon) in the grid, same as an
  // as-yet-unactive Total Level Game slot on the homepage; add a row here
  // the moment a new skill gets real art, nothing else to change.
  const SKILL_ICONS = {
    intelligence: '../assets/img/skills/intelligence.png'
  };

  // ---- avatar (mirrors profile/index.html's own mount, minus admin-view
  // impersonation — this page only ever shows the signed-in account's own
  // skills) ----
  const avatarContainer = document.getElementById('avatar-3d');
  let qzAvatar = null;
  if (avatarContainer && window.QZAvatarViewer) {
    qzAvatar = window.QZAvatarViewer.mount(avatarContainer);
  }
  const arrowLeft = document.getElementById('avatar-arrow-left');
  const arrowRight = document.getElementById('avatar-arrow-right');
  if (arrowLeft) arrowLeft.addEventListener('click', () => qzAvatar && qzAvatar.prev());
  if (arrowRight) arrowRight.addEventListener('click', () => qzAvatar && qzAvatar.next());

  async function loadAvatar(profile) {
    if (!qzAvatar || !window.QZAuth || !window.QZAuth.client) return;
    const client = window.QZAuth.client;
    const [{ data: equipped }, { data: custom }] = await Promise.all([
      client.from('equipped_items').select('slot,item_id').eq('user_id', profile.id),
      client.from('avatar_customization').select('gender,skin_colour,hair_style,hair_colour').eq('user_id', profile.id).maybeSingle()
    ]);
    const catalogById = {};
    (window.QZ_ITEM_CATALOG || []).forEach((it) => { catalogById[it.id] = it; });
    const items = {};
    (equipped || []).forEach((row) => { if (row.item_id && catalogById[row.item_id]) items[row.slot] = catalogById[row.item_id]; });
    qzAvatar.setAvatarEquipment(items);
    if (custom && qzAvatar.setBaseAppearance) {
      qzAvatar.setBaseAppearance(custom.gender, custom.skin_colour);
      if (qzAvatar.setHairstyle) qzAvatar.setHairstyle(custom.hair_style, custom.hair_colour);
    }
  }

  // Visual grid size is fixed at 24 — independent of how many real skills
  // exist in public.games right now (currently just Intelligence). Real
  // skills fill the first boxes; the rest render as plain, non-interactive
  // placeholders (no tooltip, no fabricated data) until a new skill is
  // actually added to the backend.
  const TOTAL_SKILL_SLOTS = 24;

  // Real skill boxes use the exact same component (markup, styling, hover
  // tooltip) as the Anagram Quest lobby's Intelligence card — see
  // assets/js/skill-card.js. One implementation, two pages.
  function renderSkillBox(skill) {
    return window.QZSkillCard.createBox({
      game_key: skill.game_key,
      name: skill.name,
      xp: skill.xp,
      level: skill.level,
      iconSrc: SKILL_ICONS[skill.game_key] || null
    });
  }

  function renderPlaceholderBox() {
    const box = document.createElement('div');
    box.className = 'qz-skillcard-box';
    box.innerHTML = '<span class="qz-skillcard-level">1<span class="qz-skillcard-of99">/99</span></span>';
    return box;
  }

  // ---- load whichever skills are actually real right now + this
  // account's progress in each ----
  async function loadSkills(profile) {
    const grid = document.getElementById('skill-grid');
    if (!window.QZAuth || !window.QZAuth.client) return;
    const client = window.QZAuth.client;

    const { data: games, error: gamesError } = await client
      .from('games')
      .select('game_key,name,sort_order')
      .order('sort_order', { ascending: true });
    if (gamesError || !games) return;

    let progressByKey = {};
    if (profile) {
      const { data: progress } = await client
        .from('game_progress')
        .select('game_key,xp,level')
        .eq('user_id', profile.id);
      (progress || []).forEach((p) => { progressByKey[p.game_key] = p; });
    }

    const skills = games.map((g) => {
      const p = progressByKey[g.game_key];
      return { game_key: g.game_key, name: g.name, xp: (p && p.xp) || 0, level: (p && p.level) || 1 };
    });
    // named (icon-having) skills surface first, in their own sort order —
    // matches Intelligence being "slot one" while it's still the only real
    // skill; a future skill added to public.games without an icon yet
    // would still render (unnamed, level-only) ahead of the static
    // placeholder boxes below, same as Intelligence did before it had art
    skills.sort((a, b) => {
      const an = SKILL_ICONS[a.game_key] ? 0 : 1;
      const bn = SKILL_ICONS[b.game_key] ? 0 : 1;
      return an - bn;
    });

    grid.innerHTML = '';
    skills.forEach((s) => grid.appendChild(renderSkillBox(s)));
    for (let i = skills.length; i < TOTAL_SKILL_SLOTS; i++) {
      grid.appendChild(renderPlaceholderBox());
    }

    if (profile) {
      const { data: totalLevel } = await client.rpc('total_level', { p_user: profile.id });
      document.getElementById('total-level-value').textContent =
        (typeof totalLevel === 'number' ? totalLevel : skills.length).toLocaleString();
    } else {
      document.getElementById('total-level-value').textContent = skills.length;
    }
  }

  async function init() {
    if (!window.QZAuth || !window.QZAuth.client) { await loadSkills(null); return; }
    const profile = await window.QZAuth.getProfile();
    document.getElementById('skills-username').textContent = profile ? profile.username : 'Guest';
    if (profile) await loadAvatar(profile);
    await loadSkills(profile);
  }
  init();
})();
</script>
</body>
</html>
