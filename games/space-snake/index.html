<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Snake — Quest Zone</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;600&display=swap');

  :root {
    --bg-deep: #000000;
    --bg-panel: #0a0d1f;
    --grid-line: rgba(110, 140, 220, 0.18);
    --snake-green: #39ff8f;
    --snake-green-dark: #12a85a;
    --asteroid: #b98a5e;
    --asteroid-dark: #7a5a3c;
    --helmet-glass: #7fd8ff;
    --text-main: #e8ecff;
    --accent: #6ea8ff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: 'Exo 2', sans-serif;
    overflow-x: hidden;
  }

  #starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  .topbar {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(110,140,220,0.14);
    background: rgba(0,0,0,0.82);
    backdrop-filter: blur(14px);
    box-shadow: 0 1px 0 rgba(127,179,255,0.08);
  }
  .topbar a.back {
    display: flex;
    align-items: center;
    text-decoration: none;
    opacity: 0.92;
    transition: opacity 0.15s ease;
  }
  .topbar a.back:hover { opacity: 1; }
  .topbar a.back img {
    height: 44px;
    width: auto;
    display: block;
    filter: drop-shadow(0 0 10px rgba(90,150,255,0.4));
  }

  .wrap {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: calc(100% - 46px);
    padding: 18px 14px 30px;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 7vw, 48px);
    letter-spacing: 0.06em;
    color: var(--text-main);
    text-shadow: 0 0 12px rgba(110,168,255,0.55), 0 0 28px rgba(57,255,143,0.25);
    position: relative;
    line-height: 1;
    display: flex;
    align-items: center;
  }

  /* helmet replacing the dot of a letter — sits over the A in SPACE */
  .helmet-o {
    display: inline-block;
    width: 0.78em;
    height: 0.78em;
    border-radius: 50%;
    position: relative;
    background: radial-gradient(circle at 35% 30%, #dff6ff 0%, var(--helmet-glass) 45%, #2a6f8f 100%);
    border: 2px solid #cfeeff;
    box-shadow: 0 0 14px rgba(127,216,255,0.7), inset 0 0 10px rgba(255,255,255,0.5);
    vertical-align: -0.06em;
    margin: 0 0.02em;
  }
  .helmet-o::after {
    content: '';
    position: absolute;
    top: 12%;
    left: 18%;
    width: 34%;
    height: 24%;
    background: rgba(255,255,255,0.75);
    border-radius: 50%;
    filter: blur(1px);
  }

  .subtitle {
    font-family: 'Exo 2', sans-serif;
    font-size: 12px;
    letter-spacing: 0.35em;
    color: var(--accent);
    opacity: 0.75;
    margin-bottom: 16px;
  }

  .hud {
    display: flex;
    gap: 22px;
    align-items: center;
    margin-bottom: 12px;
    font-size: 14px;
    color: var(--text-main);
  }

  .hud .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 64px;
  }

  .hud .stat span:first-child {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    color: var(--snake-green);
    text-shadow: 0 0 8px rgba(57,255,143,0.6);
  }

  .hud .stat span:last-child {
    font-size: 9px;
    letter-spacing: 0.2em;
    opacity: 0.6;
  }

  #board-frame {
    position: relative;
    border-radius: 10px;
    padding: 4px;
    background: linear-gradient(135deg, rgba(110,168,255,0.35), rgba(57,255,143,0.15));
    box-shadow: 0 0 40px rgba(80,120,255,0.25), 0 0 80px rgba(0,0,0,0.6);
  }

  canvas {
    display: block;
    border-radius: 7px;
    background: transparent;
  }

  .overlay {
    position: absolute;
    inset: 4px;
    border-radius: 7px;
    background: rgba(4,5,12,0.86);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 14px;
    padding: 20px;
  }

  .overlay.hidden { display: none; }

  .overlay h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    letter-spacing: 0.05em;
    margin: 0;
    color: var(--text-main);
  }

  .overlay p {
    margin: 0;
    font-size: 13px;
    opacity: 0.75;
    max-width: 260px;
    line-height: 1.5;
  }

  button {
    position: relative;
    overflow: hidden;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    background: linear-gradient(180deg, #9dffcb 0%, var(--snake-green) 55%, var(--snake-green-dark) 100%);
    color: #04120a;
    text-shadow: 0 1px 1px rgba(0,40,20,0.3);
    border: 1px solid rgba(220,255,235,0.5);
    padding: 12px 26px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 0 #0a5c30, 0 8px 18px rgba(20,180,110,0.4);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  button::before {
    content: '';
    position: absolute;
    top: -80%; left: -25%;
    width: 34%; height: 260%;
    background: rgba(255,255,255,0.35);
    transform: rotate(22deg);
    pointer-events: none;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 5px 0 #0a5c30, 0 10px 22px rgba(20,180,110,0.55); }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #0a5c30, 0 2px 6px rgba(20,180,110,0.35); }

  .hint {
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: 0.1em;
    opacity: 0.45;
    text-align: center;
  }

  .dpad {
    display: none;
    margin-top: 16px;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(2, 52px);
    gap: 6px;
    justify-content: center;
  }
  .dpad button.pad {
    font-family: 'Orbitron', sans-serif;
    padding: 0;
    font-size: 18px;
    background: rgba(110,168,255,0.14);
    color: var(--accent);
    box-shadow: none;
    border: 1px solid rgba(110,168,255,0.35);
  }
  #pad-up { grid-column: 2; grid-row: 1; }
  #pad-left { grid-column: 1; grid-row: 2; }
  #pad-down { grid-column: 2; grid-row: 2; }
  #pad-right { grid-column: 3; grid-row: 2; }

  @media (max-width: 560px) {
    .dpad { display: grid; }
  }
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="topbar">
  <a class="back" href="../../index.html"><img src="../../assets/img/logo.png" alt="Quest Zone"></a>
</div>

<div class="wrap">
  <div class="title-row">
    <div class="title">SP<span class="helmet-o"></span>CE SNAKE</div>
  </div>
  <div class="subtitle">ASTEROID FIELD RUN</div>

  <div class="hud">
    <div class="stat"><span id="score">0</span><span>LENGTH</span></div>
    <div class="stat"><span id="best">0</span><span>BEST</span></div>
  </div>

  <div id="board-frame">
    <canvas id="game" width="400" height="400"></canvas>

    <div id="start-overlay" class="overlay">
      <h2>READY TO LAUNCH?</h2>
      <p>Guide your snake through the drifting grid and devour asteroids. Each one you eat adds a segment. Don't hit yourself or the edge of the field.</p>
      <button id="start-btn">START</button>
    </div>

    <div id="gameover-overlay" class="overlay hidden">
      <h2>HULL BREACH</h2>
      <p id="final-score-text">Your snake grew to 0 segments.</p>
      <button id="retry-btn">RELAUNCH</button>
    </div>
  </div>

  <div class="dpad">
    <button class="pad" id="pad-up">▲</button>
    <button class="pad" id="pad-left">◀</button>
    <button class="pad" id="pad-down">▼</button>
    <button class="pad" id="pad-right">▶</button>
  </div>

  <div class="hint">ARROW KEYS OR WASD TO STEER · SPACE TO PAUSE</div>
</div>

<script>
(function () {
  // ---------- Starfield background (full page, twinkling) ----------
  const starCanvas = document.getElementById('starfield');
  const sctx = starCanvas.getContext('2d');
  let stars = [];

  function resizeStarfield() {
    starCanvas.width = window.innerWidth;
    starCanvas.height = window.innerHeight;
    const count = Math.floor((starCanvas.width * starCanvas.height) / 9000);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * starCanvas.width,
      y: Math.random() * starCanvas.height,
      r: Math.random() * 1.1 + 0.25,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.015 + 0.006,
      blue: Math.random() < 0.3
    }));
  }
  window.addEventListener('resize', resizeStarfield);
  resizeStarfield();

  function drawStarfield(t) {
    sctx.fillStyle = '#000000';
    sctx.fillRect(0, 0, starCanvas.width, starCanvas.height);
    for (const s of stars) {
      const tw = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
      sctx.globalAlpha = 0.08 + tw * 0.4;
      sctx.fillStyle = s.blue ? '#7fd8ff' : '#dfe8ff';
      sctx.beginPath();
      sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      sctx.fill();
    }
    sctx.globalAlpha = 1;
    requestAnimationFrame(drawStarfield);
  }
  requestAnimationFrame(drawStarfield);

  // ---------- Game setup ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const GRID = 20;
  const CELL = canvas.width / GRID;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const startOverlay = document.getElementById('start-overlay');
  const gameoverOverlay = document.getElementById('gameover-overlay');
  const finalScoreText = document.getElementById('final-score-text');
  const startBtn = document.getElementById('start-btn');
  const retryBtn = document.getElementById('retry-btn');

  let best = 0;
  try { best = parseInt(localStorage.getItem('spaceSnakeBest') || '0', 10); } catch (e) { best = 0; }
  bestEl.textContent = best;

  // local grid twinkle (subtle stars behind the grid, separate layer of small dots so grid feels "in space")
  let gridStars = Array.from({ length: 40 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.2 + 0.3,
    phase: Math.random() * Math.PI * 2
  }));

  let snake, dir, nextDir, asteroid, score, tickMs, timer, running, paused, frame;

  function reset() {
    snake = [
      { x: 10, y: 10 },
      { x: 9, y: 10 },
      { x: 8, y: 10 }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    tickMs = 130;
    running = false;
    paused = false;
    frame = 0;
    placeAsteroid();
    scoreEl.textContent = score;
    draw();
  }

  function placeAsteroid() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    asteroid = pos;
  }

  function start() {
    reset();
    running = true;
    startOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');
    loop();
  }

  function loop() {
    if (!running) return;
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (!paused) {
        step();
        draw();
      }
      loop();
    }, tickMs);
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
      return gameOver();
    }
    // self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === asteroid.x && head.y === asteroid.y) {
      score++;
      scoreEl.textContent = score;
      placeAsteroid();
      tickMs = Math.max(60, tickMs - 2);
    } else {
      snake.pop();
    }

    frame++;
  }

  function gameOver() {
    running = false;
    clearTimeout(timer);
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('spaceSnakeBest', String(best)); } catch (e) {}
    }
    finalScoreText.textContent = 'Your snake grew to ' + snake.length + ' segments.';
    gameoverOverlay.classList.remove('hidden');
  }

  function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    // deep space behind grid
    ctx.fillStyle = '#04050c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // subtle stars floating behind grid
    for (const s of gridStars) {
      const tw = 0.4 + 0.6 * Math.sin(frame * 0.05 + s.phase);
      ctx.globalAlpha = 0.2 + tw * 0.5;
      ctx.fillStyle = '#cfe0ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // grid lines (floating grid look)
    ctx.strokeStyle = 'rgba(110,140,220,0.18)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    // asteroid
    const ax = asteroid.x * CELL + CELL / 2;
    const ay = asteroid.y * CELL + CELL / 2;
    const ar = CELL * 0.36;
    const grad = ctx.createRadialGradient(ax - ar * 0.3, ay - ar * 0.3, ar * 0.1, ax, ay, ar);
    grad.addColorStop(0, '#d9a878');
    grad.addColorStop(1, '#6e4c30');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(ax, ay, ar, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.arc(ax - ar * 0.25, ay + ar * 0.2, ar * 0.22, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ax + ar * 0.3, ay - ar * 0.1, ar * 0.14, 0, Math.PI * 2);
    ctx.fill();

    // snake
    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const x = seg.x * CELL;
      const y = seg.y * CELL;
      const isHead = i === 0;
      const shade = isHead ? '#39ff8f' : (i % 2 === 0 ? '#12a85a' : '#0f8a4a');
      ctx.fillStyle = shade;
      roundedRect(x + 1.5, y + 1.5, CELL - 3, CELL - 3, 5);
      ctx.fill();
      if (isHead) {
        ctx.shadowColor = 'rgba(57,255,143,0.8)';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
        // eyes
        ctx.fillStyle = '#04120a';
        const ex = x + CELL / 2 + dir.x * CELL * 0.15;
        const ey = y + CELL / 2 + dir.y * CELL * 0.15;
        const perp = { x: -dir.y, y: dir.x };
        ctx.beginPath();
        ctx.arc(ex + perp.x * CELL * 0.18, ey + perp.y * CELL * 0.18, CELL * 0.07, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(ex - perp.x * CELL * 0.18, ey - perp.y * CELL * 0.18, CELL * 0.07, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ---------- Controls ----------
  function setDir(x, y) {
    if (dir.x === -x && dir.y === -y) return; // no reversing
    nextDir = { x, y };
  }

  window.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': setDir(0, -1); e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': setDir(0, 1); e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': setDir(1, 0); e.preventDefault(); break;
      case ' ':
        if (running) paused = !paused;
        e.preventDefault();
        break;
    }
  });

  document.getElementById('pad-up').addEventListener('click', () => setDir(0, -1));
  document.getElementById('pad-down').addEventListener('click', () => setDir(0, 1));
  document.getElementById('pad-left').addEventListener('click', () => setDir(-1, 0));
  document.getElementById('pad-right').addEventListener('click', () => setDir(1, 0));

  startBtn.addEventListener('click', start);
  retryBtn.addEventListener('click', start);

  reset();
})();
</script>

</body>
</html>
