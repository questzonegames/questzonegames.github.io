<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pup N Away — Quest Zone</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../assets/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/apple-touch-icon.png">
<!-- Gold bonus-life heart isn't in the initial HUD markup (only
     inserted once lives exceed 3), so it's preloaded explicitly here —
     red/black are already preloaded for free via the always-present
     <img> tags in the Lives section itself. -->
<link rel="preload" as="image" href="../../assets/img/pup-n-away/hud/hearts/gold.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --moon: #ffe9a8;
    --moon-dark: #b98a2a;
    --text-main: #fff7ea;
    --text-dim: #b9c2da;
    --panel-bg: rgba(10,14,28,0.88);
    --panel-border: rgba(160,180,255,0.3);
    --accent: #7fa8ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #060814;
    color: var(--text-main);
    font-family: 'Nunito', sans-serif;
    overflow-x: hidden;
    /* Kills the "double-tap/rapid-tap zooms or highlights text" problem
       on mobile — the viewport meta's user-scalable=no already blocks
       pinch-zoom; touch-action:manipulation additionally drops the
       double-tap-to-zoom gesture (while still allowing normal page
       scroll/pan), and the -webkit- trio stops iOS's own text-
       selection/callout flash from a fast tap landing on any text. */
    -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  /* Same interactive deep-space background as the homepage (hover-glow
     stars, drifting nebulae, occasional galaxy/shooting star) — see
     assets/js/starfield.js, shared verbatim, no game-specific copy. */
  canvas#site-starfield { position: fixed; inset: 0; z-index: 0; }

  .topbar {
    position: relative; z-index: 2;
    display: flex; align-items: center; padding: 14px 18px;
  }
  .topbar .back { display: flex; align-items: center; opacity: 0.92; transition: opacity 0.15s ease; }
  .topbar .back:hover { opacity: 1; }
  .topbar .back img { height: 88px; width: auto; display: block; filter: drop-shadow(0 0 10px rgba(90,150,255,0.4)); }

  .pna-page {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 4px 14px 30px;
  }

  .pna-title-logo {
    display: block;
    width: min(70vw, 360px);
    height: auto;
    margin: 4px 0 10px;
    filter: drop-shadow(0 0 18px rgba(255,220,140,0.3));
  }

  /* ---- stage: fixed 1920x1080 design ratio, scaled responsively ---- */
  #pna-stage-wrap {
    position: relative;
    width: min(94vw, calc((100vh - 230px) * (1920 / 1080)));
    aspect-ratio: 1920 / 1080;
    border-radius: 14px;
    overflow: hidden;
    border: 1.5px solid var(--panel-border);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 18px 50px rgba(0,0,0,0.55), 0 0 40px rgba(120,150,255,0.12);
    background: #04060c;
  }
  canvas#pna-canvas {
    display: block; width: 100%; height: 100%; touch-action: none;
  }

  /* =================================================================
     HUD toolbar — the supplied transparent PNG (a dream-themed frame
     with 4 pre-labelled sections: Score/Bones/Time/Lives) is the whole
     visual design now; nothing is drawn behind or around it. Every
     live value is real HTML, absolutely positioned over the artwork's
     own empty content boxes using PERCENTAGES measured directly from
     the PNG's pixels (see below) — so the numbers always stay locked
     to their boxes as the image scales, on any screen size.

     #pna-hud-wrapper lays out three things, kept from drifting apart
     by one grid instead of separate fixed offsets:
       column 1 (1fr, empty)  |  column 2 (auto = the toolbar itself)  |  column 3 (1fr, audio buttons, aligned to its own start)
     Two equal 1fr flanks is the standard trick that keeps the middle
     "auto" column — the toolbar — genuinely centered in the wrapper
     regardless of what (if anything) sits in column 3, rather than the
     toolbar+buttons pair being centered as one block. Below the mobile
     breakpoint there isn't room for a 3rd column at all, so the layout
     switches to a simple centered column instead (toolbar, then the
     audio buttons right-aligned under it) — see the media query.
     ================================================================= */
  #pna-hud-wrapper {
    width: 100%;
    margin-top: 3px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    column-gap: 14px;
  }
  /* The supplied PNG's own canvas has huge transparent margins above
     and below the actual drawn bar (measured directly from the pixels:
     the real art only occupies y=266..432 of the full 724-tall image —
     ~23% of it) — so even a near-zero CSS margin here still left a
     large-looking gap to the stage above, because that "gap" was
     baked into the image's own transparent padding, not this margin.
     #pna-toolbar-crop clips the layout box down to just the real bar's
     height (aspect-ratio 2172/166, matching the measured art height)
     via overflow:hidden; #pna-toolbar-frame inside it stays the FULL
     image (so the column-percentage math below, measured against the
     full 2172x724 canvas, is untouched) and is pulled up by exactly
     the top margin's own fraction (266/724 = 12.247% of the crop's
     width, since margin percentages resolve against the containing
     block's WIDTH even for margin-top) so the visible art's top edge
     lands flush at the crop container's own top edge. */
  #pna-toolbar-crop {
    grid-column: 2;
    position: relative;
    overflow: hidden;
    aspect-ratio: 2172 / 166;
    /* calc(94vw - 130px), not plain 94vw — reserves enough room on
       either side for the audio-button column (~85px) plus its gaps
       so that group never gets pushed past the viewport edge on
       desktop/tablet widths above the mobile breakpoint. */
    width: min(calc(94vw - 130px), calc((100vh - 230px) * (1920 / 1080)));
  }
  #pna-toolbar-frame {
    position: relative;
    width: 100%;
    margin-top: -12.247%;
    /* Sized in container-width units (cqw) so every live value scales
       with the TOOLBAR's own on-screen width, not the viewport. */
    container-type: inline-size;
  }
  /* The <img> sets the wrapper's real aspect ratio/height — width:100%
     height:auto is what "preserve aspect ratio, never stretch/crop"
     means in practice for a plain <img>. */
  #pna-toolbar-art { display: block; width: 100%; height: auto; }

  /* Overlay sits exactly on top of the <img>, inset:0 — every child
     column below is positioned as a PERCENTAGE of this same box, which
     is why it never drifts from the artwork at any size. */
  #pna-hud {
    position: absolute; inset: 0;
    font-family: 'Poppins', 'Baloo 2', sans-serif;
  }
  #pna-hud.hidden { display: none; }

  /* Percentages below were measured directly from the source PNG's own
     pixels (2172x724): each box's left/width as a fraction of the
     FULL image width, and the shared top/height as a fraction of the
     full image height — not eyeballed, so they land exactly inside
     the artwork's own drawn boxes at every render size. */
  .pna-hud-col {
    position: absolute;
    top: 46.96%; height: 9.53%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1.15;
    color: var(--text-main);
    text-shadow: 0 1px 2px rgba(0,0,0,0.55);
    overflow: hidden;
  }
  #pna-hud-col-score { left: 8.47%; width: 18.14%; }
  #pna-hud-col-bones  { left: 29.33%; width: 19.38%; }
  #pna-hud-col-time   { left: 51.43%; width: 19.25%; }
  /* container-type here (not on #pna-hud-lives itself, which shrinks
     to fit its own content — a circular size dependency) — the hearts
     size themselves in cqw against THIS column's own width, not the
     whole toolbar's, which is what guarantees they actually fit this
     one narrow box instead of just scaling with the toolbar overall. */
  #pna-hud-col-lives  { left: 73.44%; width: 18.09%; container-type: inline-size; }

  #pna-hud-score, #pna-hud-bones, #pna-hud-timer {
    font-weight: 700;
    font-size: clamp(9px, 4.6cqw, 22px);
    color: #fff6e0;
  }
  .pna-hud-timer-value { font-variant-numeric: tabular-nums; }
  #pna-hud-level {
    font-weight: 500;
    font-size: clamp(6px, 2.1cqw, 10px);
    color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 96%;
  }
  /* Lives — the 3 supplied heart PNGs (red/black/gold), never emoji or
     CSS shapes. --pna-heart-extra is set by JS (updateHud() in
     pup-n-away-ui.js) to the count of bonus hearts beyond the normal
     3 slots, so the row shrinks slightly rather than ever overflowing
     the Lives box or wrapping to a second line. */
  #pna-hud-lives {
    --pna-heart-extra: 0;
    display: flex; flex-wrap: nowrap; align-items: center; justify-content: center;
    width: 100%;
    gap: calc(4cqw - (var(--pna-heart-extra) * 0.5cqw));
  }
  .pna-heart-slot, .pna-heart-icon.pna-heart-gold-slot {
    /* cqw here is against #pna-hud-col-lives's own (narrow) width, not
       the whole toolbar's — see the container-type on that column
       above — so 3 hearts fill the box neatly and each extra bonus
       heart shrinks the row by a fixed, tuned amount, always landing
       comfortably inside the box instead of merely scaling with it. */
    width: clamp(5px, calc(26cqw - (var(--pna-heart-extra) * 5cqw)), 20px);
    aspect-ratio: 1 / 1;
    flex: none;
  }
  /* Each of the 3 normal slots stacks its red/black PNG on top of each
     other (both always present in the DOM, so both are preloaded from
     first paint — no fetch/decode flicker the first time a life is
     lost) and crossfades between them via opacity/scale. */
  .pna-heart-slot { position: relative; }
  .pna-heart-slot .pna-heart-icon {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; display: block;
    opacity: 0; transform: scale(0.82);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .pna-heart-slot .pna-heart-icon.active { opacity: 1; transform: scale(1); }
  /* Bonus gold hearts are plain (no red/black toggle) — appended/
     removed by JS as the live count crosses 3, fading in on entry. */
  .pna-heart-icon.pna-heart-gold-slot {
    object-fit: contain; display: block;
    opacity: 0; transform: scale(0.82);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .pna-heart-icon.pna-heart-gold-slot.active { opacity: 1; transform: scale(1); }

  /* ---- audio control group — the game's two existing Music/Sound
     buttons (each opens the shared popover below with its own 0-100%
     slider), just relocated and restyled to sit beside the toolbar
     instead of inside it. ---- */
  .pna-toolbar-controls {
    grid-column: 3; justify-self: start;
    display: flex; gap: 8px; align-items: center;
  }
  .pna-audio-icon-btn {
    width: clamp(28px, 4vw, 38px); height: clamp(28px, 4vw, 38px); flex: none;
    border-radius: 10px;
    border: 1.5px solid var(--panel-border); background: rgba(10,20,50,0.55);
    color: var(--moon); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .pna-audio-icon-btn svg { width: 55%; height: 55%; }
  .pna-audio-icon-btn:hover { border-color: var(--moon); box-shadow: 0 0 10px rgba(255,220,140,0.35); }

  /* Below the mobile breakpoint there's no 3rd grid column to spare —
     stack the audio buttons under the toolbar's own right edge instead
     (still clear of the toolbar artwork and the stage, never on top of
     either). */
  @media (max-width: 720px) {
    #pna-hud-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    #pna-toolbar-crop { grid-column: auto; width: min(94vw, calc((100vh - 230px) * (1920 / 1080))); }
    .pna-toolbar-controls {
      grid-column: auto; justify-self: auto;
      width: min(94vw, calc((100vh - 230px) * (1920 / 1080)));
      justify-content: flex-end;
    }
  }

  /* ---- mobile move buttons — the game is keyboard-only by design (see
     pup-n-away-input.js), which leaves touch devices with no way to
     move the basket at all. These two big thumb-sized buttons sit
     BELOW the toolbar (outside the playable stage, like everything
     else in the toolbar) and just hold the same left/right input flags
     a held key would. Hidden on desktop — same show-on-touch pattern
     as Starbound's d-pad — since keyboard already covers that case. */
  #pna-move-controls {
    display: none;
    width: min(94vw, calc((100vh - 230px) * (1920 / 1080)));
    margin-top: 10px;
    justify-content: space-between;
  }
  .pna-move-btn {
    width: 84px; height: 84px; border-radius: 50%;
    background: var(--panel-bg); border: 1.5px solid var(--panel-border);
    color: var(--moon); font-size: 34px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    /* Without the -webkit- prefixed properties, iOS Safari's own
       text-selection/callout gesture recognizer can grab a fast or
       repeated tap on this glyph — showing the selection-highlight/
       copy-paste callout instead of registering the press, which is
       also what was silently eating the touch and stopping the basket
       from moving at all on a real phone. */
    -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none; touch-action: none;
  }
  .pna-move-btn span { pointer-events: none; }
  .pna-move-btn:active { background: rgba(255,255,255,0.12); border-color: var(--moon); }
  @media (max-width: 720px), (pointer: coarse) {
    #pna-move-controls { display: flex; }
  }

  .pna-audio-popover {
    position: fixed; z-index: 300;
    width: 220px; padding: 14px 16px 16px;
    background: rgba(10,14,26,0.97); border: 1.5px solid var(--panel-border);
    border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,0.55);
    opacity: 0; transform: translateY(-6px); pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .pna-audio-popover.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .pna-audio-popover-title {
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 12px;
    letter-spacing: 0.08em; color: var(--moon); margin-bottom: 10px;
  }
  .pna-audio-popover-row { display: flex; align-items: center; gap: 10px; }
  .pna-audio-popover-slider { flex: 1; accent-color: var(--moon); cursor: pointer; }
  .pna-audio-popover-value {
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 12.5px;
    color: var(--text-main); min-width: 34px; text-align: right; font-variant-numeric: tabular-nums;
  }
  .pna-audio-popover-note { margin-top: 8px; font-size: 10.5px; color: var(--text-dim); line-height: 1.4; }

  /* ---- miss banner ---- */
  #pna-miss-banner {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: clamp(20px, 6cqw, 40px);
    color: #ff8a8a; text-shadow: 0 0 20px rgba(255,80,80,0.6), 0 2px 4px rgba(0,0,0,0.8);
    opacity: 0; pointer-events: none; z-index: 4; transition: opacity 0.15s ease, transform 0.15s ease;
  }
  #pna-miss-banner.hidden { display: none; }
  #pna-miss-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* ---- overlay screens ---- */
  .pna-overlay {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(8px, 2cqw, 16px); text-align: center; padding: clamp(10px, 3cqw, 20px);
    background: radial-gradient(ellipse at center, rgba(14,18,34,0.55) 0%, rgba(4,6,14,0.88) 75%);
  }
  .pna-overlay.hidden { display: none; }
  .pna-logo { max-width: min(72%, 460px); width: 100%; height: auto; filter: drop-shadow(0 0 24px rgba(255,220,140,0.35)); }

  #pna-screen-title { z-index: 20; }
  #pna-screen-title .pna-logo { max-width: min(84%, 540px); margin-bottom: 6px; }

  .pna-overlay-heading {
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: clamp(16px, 4.5cqw, 30px);
    letter-spacing: 0.02em; color: var(--moon); text-shadow: 0 0 18px rgba(255,220,140,0.4);
  }
  .pna-overlay-sub { color: var(--text-dim); font-size: clamp(10px, 2cqw, 13px); max-width: 420px; }
  .pna-stat-line { font-family: 'Baloo 2', sans-serif; font-size: clamp(11px, 2.3cqw, 15px); color: var(--text-main); }
  .pna-stat-line b { color: var(--moon); }

  .pna-btn {
    font-family: 'Baloo 2', sans-serif; font-weight: 800; letter-spacing: 0.02em;
    border: none; cursor: pointer; border-radius: 999px;
    padding: clamp(9px, 2.2cqw, 15px) clamp(18px, 5cqw, 34px); font-size: clamp(11px, 2.3cqw, 15px);
    background: linear-gradient(180deg, #ffe9a8 0%, #ffcf5c 45%, #d9922a 100%);
    color: #3a2500;
    box-shadow: 0 8px 0 #8a5c00, 0 14px 24px rgba(0,0,0,0.4);
    transition: transform 0.08s ease;
  }
  .pna-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #8a5c00, 0 8px 16px rgba(0,0,0,0.4); }
  .pna-btn.secondary {
    background: linear-gradient(180deg, #6f92e0 0%, #2f4d9f 100%);
    color: #fff; box-shadow: 0 8px 0 #16255c, 0 14px 24px rgba(0,0,0,0.4);
  }
  .pna-btn.secondary:active { box-shadow: 0 4px 0 #16255c, 0 8px 16px rgba(0,0,0,0.4); }
  .pna-overlay-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  /* =================================================================
     Result panels (Level Complete / Game Over) — the two supplied
     transparent PNGs are the entire visual design, exactly like the
     toolbar. Every live value and button hitbox is real HTML
     positioned as a PERCENTAGE of the panel's own box (measured
     directly from each PNG's pixels, both 1536x1024), so everything
     stays locked to its drawn box as the panel scales. The panel sits
     centered inside the existing .pna-overlay dimming scrim — nothing
     new needed there, it already darkens the level behind it.
     ================================================================= */
  .pna-result-panel {
    position: relative;
    width: min(92%, 640px);
    aspect-ratio: 1536 / 1024;
    container-type: inline-size;
  }
  .pna-result-panel-art { display: block; width: 100%; height: 100%; object-fit: contain; }
  .pna-result-panel-content {
    position: absolute; inset: 0;
    font-family: 'Poppins', 'Baloo 2', sans-serif;
  }
  .pna-result-region {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    color: #fff6e0; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    font-weight: 700; line-height: 1.1;
    overflow: hidden; padding: 0 2%;
  }
  .pna-result-value { font-size: clamp(9px, 6.6cqw, 28px); }
  .pna-result-value.pna-hud-timer-value { font-variant-numeric: tabular-nums; }
  #pna-lc-level-name-region .pna-result-value {
    font-size: clamp(9px, 5.4cqw, 24px);
    white-space: nowrap; text-overflow: ellipsis; overflow: hidden; max-width: 100%;
  }
  /* Real, transparent, keyboard-focusable buttons sitting exactly over
     each PNG's own baked-in gold button artwork — no visible label of
     our own drawn on top of it. */
  .pna-result-btn-hitbox {
    position: absolute;
    background: transparent; border: none; border-radius: 999px;
    cursor: pointer; padding: 0;
  }
  .pna-result-btn-hitbox:hover { background: rgba(255,255,255,0.08); }
  .pna-result-btn-hitbox:focus-visible { outline: 3px solid #fff6e0; outline-offset: 2px; }
  .pna-result-btn-hitbox:active { background: rgba(255,255,255,0.14); }
  .pna-result-btn-hitbox:disabled { cursor: default; }

  /* ---- Level Complete panel regions (percentages measured from
     assets/img/pup-n-away/hud/level-complete-panel.png, 1536x1024) ---- */
  #pna-lc-level-name-region { left: 22.92%; width: 54.10%; top: 27.15%; height: 8.40%; }
  #pna-lc-score-region      { left: 11.07%; width: 23.70%; top: 45.61%; height: 9.47%; }
  #pna-lc-bones-region      { left: 38.09%; width: 23.70%; top: 45.61%; height: 9.47%; }
  #pna-lc-time-region       { left: 65.10%; width: 24.09%; top: 45.61%; height: 9.47%; }
  #pna-btn-continue    { left: 19.53%; width: 27.34%; top: 82.23%; height: 8.79%; }
  #pna-btn-return-lc   { left: 53.06%; width: 27.54%; top: 82.23%; height: 8.79%; }

  /* ---- Game Over panel regions (percentages measured from
     assets/img/pup-n-away/hud/game-over-panel.png, 1536x1024) ---- */
  #pna-go-score-region      { left: 16.21%; width: 67.58%; top: 50.98%; height: 16.21%; }
  #pna-btn-restart-act { left: 13.93%; width: 31.58%; top: 73.24%; height: 10.55%; }
  #pna-btn-return-go   { left: 54.49%; width: 31.77%; top: 73.24%; height: 10.55%; }

  /* ---- loading ---- */
  #pna-screen-loading { z-index: 25; background: #04060c; }
  .pna-loading-track { width: min(70%, 360px); height: 10px; border-radius: 6px; background: rgba(255,255,255,0.1); overflow: hidden; }
  #pna-loading-bar { height: 100%; width: 0%; border-radius: 6px; background: linear-gradient(90deg, #ffcf5c, #ffe9a8); transition: width 0.15s ease; }

  /* ---- countdown ---- */
  #pna-screen-countdown { background: transparent; }
  #pna-countdown-number {
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: clamp(40px, 20cqw, 140px);
    color: var(--moon); text-shadow: 0 0 30px rgba(255,220,140,0.5);
  }

  .pna-hint { margin-top: 12px; font-size: 12px; color: var(--text-dim); }

  @media (prefers-reduced-motion: reduce) {
    #pna-miss-banner { transition: none; }
  }
</style>
</head>
<body>
<canvas id="site-starfield"></canvas>

<div class="topbar">
  <a class="back" href="../../index.html"><img src="../../assets/img/logo.png" alt="Quest Zone"></a>
</div>

<!-- Shared popover for the Music/Sound buttons in the toolbar's audio
     group below — JS repositions it under whichever button was
     clicked. See wireAudioControls() in pup-n-away.js. -->
<div id="pna-audio-popover" class="pna-audio-popover" role="dialog" aria-hidden="true">
  <div class="pna-audio-popover-title" id="pna-audio-popover-title">SOUND</div>
  <div class="pna-audio-popover-row">
    <input type="range" id="pna-audio-popover-slider" class="pna-audio-popover-slider" min="0" max="100" value="70">
    <div class="pna-audio-popover-value"><span id="pna-audio-popover-value">70</span>%</div>
  </div>
  <div class="pna-audio-popover-note" id="pna-audio-popover-note"></div>
</div>

<div class="pna-page">
  <img class="pna-title-logo" src="../../assets/img/pup-n-away/logo/logo.png" alt="Pup N Away">

  <div id="pna-stage-wrap">
    <canvas id="pna-canvas" width="1920" height="1080"></canvas>

    <div id="pna-miss-banner" class="hidden">Missed!</div>

    <!-- ============== LOADING ============== -->
    <div id="pna-screen-loading" class="pna-overlay hidden">
      <img class="pna-logo" src="../../assets/img/pup-n-away/logo/logo.png" alt="Pup N Away">
      <div class="pna-loading-track"><div id="pna-loading-bar"></div></div>
      <div class="pna-overlay-sub" id="pna-loading-label">Loading… 0%</div>
    </div>

    <!-- ============== TITLE ============== -->
    <div id="pna-screen-title" class="pna-overlay hidden">
      <img class="pna-logo" src="../../assets/img/pup-n-away/logo/logo.png" alt="Pup N Away">
      <button type="button" class="pna-btn" id="pna-btn-start">Play</button>
      <div class="pna-hint">A / D or ◀ ▶ to move the basket</div>
    </div>

    <!-- ============== INTRO (dream transition) ============== -->
    <div id="pna-screen-intro" class="pna-overlay hidden">
      <img class="pna-logo" src="../../assets/img/pup-n-away/dog/misc/sit.png" alt="" style="max-width:min(40%,260px);filter:drop-shadow(0 0 20px rgba(140,170,255,0.4));">
      <div class="pna-overlay-heading">Time for a dream…</div>
      <div class="pna-overlay-sub">The pup drifts off to sleep, chasing dreams full of bones.</div>
      <button type="button" class="pna-btn secondary" id="pna-btn-skip-intro">Skip Intro</button>
    </div>

    <!-- ============== COUNTDOWN ============== -->
    <div id="pna-screen-countdown" class="pna-overlay hidden">
      <div id="pna-countdown-number">3</div>
    </div>

    <!-- ============== LEVEL COMPLETE ==============
         Real HTML overlay above the supplied transparent PNG — see the
         .pna-result-* CSS above for how each region/button is aligned
         to the artwork's own boxes via measured percentages. Rating
         stars are deliberately left alone (no rating system yet). -->
    <div id="pna-screen-level-complete" class="pna-overlay hidden">
      <div class="pna-result-panel">
        <img class="pna-result-panel-art" src="../../assets/img/pup-n-away/hud/level-complete-panel.png" alt="Level Complete!">
        <div class="pna-result-panel-content">
          <div class="pna-result-region" id="pna-lc-level-name-region"><span class="pna-result-value" id="pna-lc-level-name"></span></div>
          <div class="pna-result-region" id="pna-lc-score-region"><span class="pna-result-value" id="pna-lc-score">0</span></div>
          <div class="pna-result-region" id="pna-lc-bones-region"><span class="pna-result-value" id="pna-lc-bones">0 / 0</span></div>
          <div class="pna-result-region" id="pna-lc-time-region"><span class="pna-result-value pna-hud-timer-value" id="pna-lc-time">0:00.0</span></div>
          <button type="button" class="pna-result-btn-hitbox" id="pna-btn-continue" aria-label="Continue"></button>
          <button type="button" class="pna-result-btn-hitbox" id="pna-btn-return-lc" aria-label="Return to Lobby"></button>
        </div>
      </div>
    </div>

    <!-- ============== GAME OVER ============== -->
    <div id="pna-screen-game-over" class="pna-overlay hidden">
      <div class="pna-result-panel">
        <img class="pna-result-panel-art" src="../../assets/img/pup-n-away/hud/game-over-panel.png" alt="Game Over">
        <div class="pna-result-panel-content">
          <div class="pna-result-region" id="pna-go-score-region"><span class="pna-result-value" id="pna-go-score">0</span></div>
          <button type="button" class="pna-result-btn-hitbox" id="pna-btn-restart-act" aria-label="Restart Act"></button>
          <button type="button" class="pna-result-btn-hitbox" id="pna-btn-return-go" aria-label="Return to Lobby"></button>
        </div>
      </div>
    </div>

    <!-- ============== PAUSED ============== -->
    <div id="pna-screen-paused" class="pna-overlay hidden">
      <div class="pna-overlay-heading">Paused</div>
      <div class="pna-overlay-btns">
        <button type="button" class="pna-btn" id="pna-btn-resume">Resume</button>
        <button type="button" class="pna-btn secondary" id="pna-btn-restart-paused">Restart Level</button>
        <button type="button" class="pna-btn secondary" id="pna-btn-return-paused">Return to Quest Zone</button>
      </div>
    </div>
  </div>

  <!-- HUD toolbar — the supplied transparent PNG is the entire visual
       design; every live value is real HTML absolutely positioned over
       its own empty box in the artwork (see the CSS above for how the
       percentages were measured). Entirely outside the playable 16:9
       stage above, so nothing in a level is ever covered up. -->
  <div id="pna-hud-wrapper">
    <div id="pna-toolbar-crop">
      <div id="pna-toolbar-frame">
        <img id="pna-toolbar-art" src="../../assets/img/pup-n-away/hud/toolbar.png" alt="">
        <div id="pna-hud" class="hidden">
          <div class="pna-hud-col" id="pna-hud-col-score">
            <div id="pna-hud-score">0</div>
          </div>
          <div class="pna-hud-col" id="pna-hud-col-bones">
            <div id="pna-hud-bones">0 / 0</div>
            <div id="pna-hud-level"></div>
          </div>
          <div class="pna-hud-col" id="pna-hud-col-time">
            <div id="pna-hud-timer" class="pna-hud-timer-value">0:00.0</div>
          </div>
          <div class="pna-hud-col" id="pna-hud-col-lives">
            <!-- 3 fixed normal-life slots — both the red and black PNG
                 for each slot are always in the DOM (just one made
                 .active at a time) so both are preloaded from first
                 paint, never fetched/decoded for the first time at the
                 exact moment a life is lost. Bonus gold hearts (life 4+)
                 are inserted/removed here by JS — see updateHud() in
                 pup-n-away-ui.js. -->
            <div id="pna-hud-lives">
              <div class="pna-heart-slot" data-life-slot="1">
                <img class="pna-heart-icon" data-heart-color="red" src="../../assets/img/pup-n-away/hud/hearts/red.png" alt="">
                <img class="pna-heart-icon" data-heart-color="black" src="../../assets/img/pup-n-away/hud/hearts/black.png" alt="">
              </div>
              <div class="pna-heart-slot" data-life-slot="2">
                <img class="pna-heart-icon" data-heart-color="red" src="../../assets/img/pup-n-away/hud/hearts/red.png" alt="">
                <img class="pna-heart-icon" data-heart-color="black" src="../../assets/img/pup-n-away/hud/hearts/black.png" alt="">
              </div>
              <div class="pna-heart-slot" data-life-slot="3">
                <img class="pna-heart-icon" data-heart-color="red" src="../../assets/img/pup-n-away/hud/hearts/red.png" alt="">
                <img class="pna-heart-icon" data-heart-color="black" src="../../assets/img/pup-n-away/hud/hearts/black.png" alt="">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- The game's two existing audio controls (each opens the shared
         popover below with its own 0-100% slider) — relocated here,
         restyled, functionally unchanged. See wireAudioControls() in
         pup-n-away.js. -->
    <div class="pna-toolbar-controls">
      <button class="pna-audio-icon-btn" type="button" data-audio-popover="music" title="Music" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </button>
      <button class="pna-audio-icon-btn" type="button" data-audio-popover="sound" title="Sound" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg>
      </button>
    </div>
  </div>

  <!-- Mobile move buttons — see #pna-move-controls above (only shown on
       touch/narrow screens). Held down, they act exactly like holding
       A/D or the arrow keys — see wireMoveButtons() in pup-n-away.js. -->
  <div id="pna-move-controls">
    <button type="button" class="pna-move-btn" id="pna-btn-move-left" aria-label="Move basket left"><span>◀</span></button>
    <button type="button" class="pna-move-btn" id="pna-btn-move-right" aria-label="Move basket right"><span>▶</span></button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>

<script src="../../assets/js/qz-auth.js"></script>

<script src="pup-n-away-audio.js"></script>
<script src="pup-n-away-physics.js"></script>
<script src="pup-n-away-basket.js"></script>
<script src="pup-n-away-dog.js"></script>
<script src="pup-n-away-collectibles.js"></script>
<script src="pup-n-away-levels.js"></script>
<script src="pup-n-away-ui.js"></script>
<script src="pup-n-away-integration.js"></script>
<script src="pup-n-away.js"></script>
</body>
