<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">

<style>
  main.highscores { padding: 28px 0 70px; position: relative; z-index: 1; }

  /* ---- outer chrome frame (reuses the same look as .game-section) ---- */
  .hs-frame {
    position: relative;
    border: 3px solid transparent;
    border-radius: 16px;
    padding: 22px clamp(14px, 3vw, 30px) 28px;
    background: var(--qp-fill) padding-box, var(--chrome-frame) border-box;
  }
  .hs-frame .hud-heading { font-size: clamp(24px, 4.4vw, 40px); margin: 0 0 clamp(18px, 2.6vw, 26px); }

  .hs-layout {
    display: grid;
    grid-template-columns: 250px 1fr 280px;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 1050px) {
    .hs-layout { grid-template-columns: 1fr; }
  }

  /* ---- shared panel chrome for all three columns — same gunmetal-blue
     metal bevel as the nav bar instead of a flat panel fill ---- */
  .hs-panel {
    position: relative;
    background: linear-gradient(180deg, #1a2138 0%, #10152a 16%, #0a0d18 100%);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 14px;
    box-shadow:
      inset 0 1px 0 rgba(190,210,255,0.12),
      inset 0 -1px 0 rgba(0,0,0,0.4);
  }
  .hs-panel-title {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-style: italic;
    letter-spacing: 0.06em; font-size: 15px; color: var(--text);
    margin: 0 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
  }

  /* ---- left: skills list ---- */
  .hs-skill-list { display: flex; flex-direction: column; gap: 6px; }
  .hs-skill-btn {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left; cursor: pointer;
    background: linear-gradient(180deg, rgba(140,170,255,0.08) 0%, rgba(140,170,255,0) 30%, rgba(0,0,10,0.15) 100%), #10152a;
    border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 10px;
    color: var(--text); font-family: 'Exo 2', sans-serif; font-size: 13px; font-weight: 600;
    box-shadow: inset 0 1px 0 rgba(190,210,255,0.1);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .hs-skill-btn:hover {
    border-color: rgba(150,185,255,0.5);
    box-shadow: inset 0 1px 0 rgba(200,220,255,0.18), inset 0 0 12px rgba(90,150,255,0.14);
    color: #fff;
  }
  .hs-skill-btn.active {
    background: linear-gradient(180deg, rgba(70,140,255,0.24) 0%, rgba(30,70,150,0.16) 100%);
    border-color: var(--blue-light);
    box-shadow: inset 0 0 0 1px rgba(130,220,255,0.5), inset 0 0 14px rgba(80,180,255,0.22);
    color: #fff;
  }
  .hs-skill-btn:active { transform: translateY(1px) scale(0.99); }
  .hs-skill-btn.placeholder { opacity: 0.55; }
  .hs-skill-btn.placeholder:hover { opacity: 0.8; }
  .hs-skill-icon { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .hs-skill-icon img { width: 100%; height: 100%; object-fit: contain; }
  .hs-skill-icon svg { width: 18px; height: 18px; opacity: 0.7; }
  .hs-skill-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hs-skill-arrow { opacity: 0.5; font-size: 12px; }
  .hs-skill-btn.active .hs-skill-arrow { opacity: 1; color: var(--blue-light); }

  /* ---- centre: table ---- */
  /* Table/badge/state visuals now live in assets/css/hiscores.css (shared
     with player.html and compare.html) — only this page's own heading
     style stays here. */
  .hs-center-heading {
    font-family: 'Exo 2', sans-serif; font-weight: 800; font-size: 19px; color: #fff;
    margin: 0 0 14px;
  }

  /* ---- pagination ---- */
  .hs-pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .hs-page-btn {
    min-width: 36px; height: 36px; padding: 0 8px;
    border-radius: 8px; border: 1px solid var(--border-strong);
    background: linear-gradient(180deg, rgba(140,170,255,0.1) 0%, rgba(140,170,255,0) 30%, rgba(0,0,10,0.15) 100%), #10152a;
    color: var(--text);
    font-family: 'Exo 2', sans-serif; font-weight: 700; font-size: 13px;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(190,210,255,0.1);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, color 0.15s ease, transform 0.05s ease;
  }
  .hs-page-btn:hover:not(:disabled) {
    border-color: rgba(150,185,255,0.5); color: #fff;
    box-shadow: inset 0 1px 0 rgba(200,220,255,0.18), inset 0 0 10px rgba(90,150,255,0.14);
  }
  .hs-page-btn:active:not(:disabled) { transform: translateY(1px) scale(0.97); }
  .hs-page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .hs-page-btn.active {
    background: linear-gradient(180deg, rgba(70,140,255,0.3), rgba(30,70,150,0.18));
    border-color: var(--blue-light); color: #fff;
    box-shadow: inset 0 0 0 1px rgba(130,220,255,0.5), inset 0 0 12px rgba(80,180,255,0.22);
  }
  .hs-page-ellipsis { color: var(--text-dim); font-size: 13px; padding: 0 2px; }

  /* ---- centre states: loading skeleton (empty/error/coming-soon states
     use the shared .hs-state from assets/css/hiscores.css) ---- */
  .hs-skeleton-row { height: 34px; border-radius: 6px; margin-bottom: 8px; background: linear-gradient(90deg, var(--bg-panel-alt) 25%, rgba(255,255,255,0.06) 50%, var(--bg-panel-alt) 75%); background-size: 200% 100%; animation: hsShimmer 1.3s infinite linear; }
  @keyframes hsShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* ---- right column ---- */
  .hs-right-col { display: flex; flex-direction: column; gap: 16px; }
  .hs-field-label { font-size: 11.5px; color: var(--text-dim); letter-spacing: 0.03em; margin: 0 0 6px; }
  .hs-input {
    width: 100%;
    background: linear-gradient(180deg, rgba(140,170,255,0.08) 0%, rgba(140,170,255,0) 30%, #0a0d16 100%);
    border: 1px solid var(--border-strong);
    border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 13px;
    font-family: 'Exo 2', sans-serif; margin-bottom: 10px;
    box-shadow: inset 0 1px 0 rgba(190,210,255,0.1), inset 0 4px 8px -6px rgba(0,0,0,0.5);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .hs-input:focus {
    outline: none; border-color: var(--blue-light);
    box-shadow: inset 0 1px 0 rgba(200,220,255,0.16), 0 0 0 3px rgba(59,130,246,0.18), 0 0 16px rgba(59,130,246,0.2);
  }
  /* same brushed gunmetal-blue keycap as the nav bar, including the
     hover shimmer sweep and sink-in press */
  .hs-btn {
    position: relative;
    overflow: hidden;
    width: 100%; border: 1px solid rgba(130,160,255,0.35); border-radius: 8px;
    background: linear-gradient(180deg, #2c3652 0%, #171d30 45%, #0a0d18 100%);
    color: #fff; font-family: 'Exo 2', sans-serif; font-weight: 700; font-size: 12.5px;
    letter-spacing: 0.04em; padding: 11px; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(190,210,255,0.16), inset 0 -1px 0 rgba(0,0,0,0.4);
    transition: box-shadow 0.15s ease, transform 0.05s ease;
  }
  .hs-btn::before {
    content: '';
    position: absolute; inset: 0; left: -75%; width: 45%;
    background: linear-gradient(115deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 32%, rgba(210,228,255,0.55) 48%, rgba(154,127,255,0.3) 56%, rgba(255,255,255,0) 68%, rgba(255,255,255,0) 100%);
    transform: skewX(-18deg);
    opacity: 0;
    pointer-events: none;
  }
  .hs-btn > * { position: relative; }
  .hs-btn:hover {
    box-shadow: inset 0 1px 0 rgba(200,220,255,0.24), inset 0 -1px 0 rgba(0,0,0,0.4), 0 0 14px rgba(59,130,246,0.3);
  }
  .hs-btn:hover::before { opacity: 1; animation: hs-btn-shimmer 0.85s ease forwards; }
  @keyframes hs-btn-shimmer { from { left: -75%; } to { left: 130%; } }
  .hs-btn:active {
    transform: translateY(1px) scale(0.98);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
  }

  .hs-result-box {
    margin-top: 12px; padding: 10px 12px; border-radius: 8px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    font-size: 12.5px; color: var(--text-dim); min-height: 20px;
  }
  .hs-result-box.hs-ok { border-color: rgba(57,255,143,0.4); color: var(--text); }
  .hs-result-box.hs-err { border-color: rgba(255,110,110,0.4); color: #ffb4b4; }
  .hs-result-box .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .hs-result-box .row span:first-child { color: var(--text-dim); }
  .hs-result-box .row span:last-child { font-family: 'Orbitron', sans-serif; color: var(--blue-light); font-weight: 700; }
  .hs-compare-block { margin-top: 8px; }
  .hs-compare-block h4 { margin: 10px 0 4px; font-size: 11.5px; color: var(--blue-light); letter-spacing: 0.05em; text-transform: uppercase; }

  .hs-loader-inline { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); border-top-color: #fff; animation: hsSpin 0.7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes hsSpin { to { transform: rotate(360deg); } }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>

<script>
(function () {
  // ================= config =================
  const ROWS_PER_PAGE = 25; // change this one constant to retune every page size
  const PAGE_WINDOW = 4;    // how many numbered page buttons show at once

  const escapeHtml = window.QZHiscores.escapeHtml;
  const rankBadgeHtml = window.QZHiscores.rankBadgeHtml;

  // ================= state =================
  // SKILL_REGISTRY is built once at init (Total Level + real games from
  // Supabase + fixed placeholder slots) — see assets/js/hiscores-shared.js.
  // Every other function reads from this, never a second hardcoded list.
  let SKILL_REGISTRY = [];
  const state = {
    selectedSkillId: 'overall',
    currentPage: 1,
    totalPages: 1,
    lastRows: []
  };

  function client() { return window.QZAuth && window.QZAuth.client; }

  function renderSkillList() {
    const list = document.getElementById('hs-skill-list');
    list.innerHTML = '';
    SKILL_REGISTRY.forEach((skill) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'hs-skill-btn' + (skill.id === state.selectedSkillId ? ' active' : '') + (skill.placeholder ? ' placeholder' : '');
      btn.innerHTML =
        '<span class="hs-skill-icon">' + skill.iconHtml + '</span>' +
        '<span class="hs-skill-name">' + escapeHtml(skill.name) + '</span>' +
        '<span class="hs-skill-arrow">›</span>';
      btn.addEventListener('click', () => selectSkill(skill.id));
      list.appendChild(btn);
    });
  }

  function selectSkill(skillId) {
    if (state.selectedSkillId === skillId) return;
    state.selectedSkillId = skillId;
    state.currentPage = 1;
    renderSkillList();
    loadPage();
  }

  function currentSkill() {
    return SKILL_REGISTRY.find((s) => s.id === state.selectedSkillId) || SKILL_REGISTRY[0];
  }

  // ================= data loading =================
  async function loadPage() {
    const skill = currentSkill();
    document.getElementById('hs-center-heading').textContent = skill.name + ' Highscores';

    if (skill.placeholder) {
      renderComingSoon();
      renderPagination();
      return;
    }

    renderLoadingSkeleton();
    try {
      const offset = (state.currentPage - 1) * ROWS_PER_PAGE;
      let rows, error;
      if (skill.id === 'overall') {
        ({ data: rows, error } = await client().rpc('hiscores_overall', { p_limit: ROWS_PER_PAGE, p_offset: offset }));
      } else {
        ({ data: rows, error } = await client().rpc('hiscores_skill', { p_game_key: skill.id, p_limit: ROWS_PER_PAGE, p_offset: offset }));
      }
      if (error) throw error;
      state.lastRows = rows || [];
      state.totalPages = rows && rows.length ? Math.max(1, Math.ceil(rows[0].total_count / ROWS_PER_PAGE)) : 1;
      if (!rows || rows.length === 0) {
        renderEmpty();
      } else {
        renderTable(rows, skill);
      }
      renderPagination();
    } catch (err) {
      console.error('Highscores: query failed', err);
      renderError();
      renderPagination();
    }
  }

  // ================= centre states =================
  function renderLoadingSkeleton() {
    const body = document.getElementById('hs-center-body');
    let html = '<div class="hs-table-wrap"><table class="hs-table"><thead><tr><th class="hs-col-rank">Rank</th><th class="hs-col-name">Name</th><th class="hs-col-level">Level</th><th class="hs-col-xp">XP</th></tr></thead></table></div><div style="padding-top:8px;">';
    for (let i = 0; i < 8; i++) html += '<div class="hs-skeleton-row"></div>';
    html += '</div>';
    body.innerHTML = html;
    document.getElementById('hs-pagination').innerHTML = '';
  }
  function renderEmpty() {
    document.getElementById('hs-center-body').innerHTML =
      '<div class="hs-state"><div class="icon">📭</div>No players found yet.</div>';
  }
  function renderError() {
    document.getElementById('hs-center-body').innerHTML =
      '<div class="hs-state"><div class="icon">⚠️</div>Couldn’t load the highscores right now. Please try again shortly.</div>';
  }
  function renderComingSoon() {
    document.getElementById('hs-center-body').innerHTML =
      '<div class="hs-state"><div class="icon">🛠️</div>This skill hasn’t launched yet — check back soon!</div>';
  }

  function renderTable(rows, skill) {
    const tbody = document.getElementById('hs-table-body');
    const wrap = document.createElement('div');
    wrap.className = 'hs-table-wrap';
    const table = document.createElement('table');
    table.className = 'hs-table';
    table.innerHTML =
      '<thead><tr><th class="hs-col-rank">Rank</th><th class="hs-col-name">Name</th><th class="hs-col-level">Level</th><th class="hs-col-xp">XP</th></tr></thead><tbody></tbody>';
    wrap.appendChild(table);
    document.getElementById('hs-center-body').innerHTML = '';
    document.getElementById('hs-center-body').appendChild(wrap);
    const body = table.querySelector('tbody');

    rows.forEach((row) => {
      const level = skill.id === 'overall' ? row.total_level : row.level;
      const xp = skill.id === 'overall' ? row.total_xp : row.xp;
      const bannedClass = row.is_banned ? ' hs-banned-name' : '';
      const bannedTag = row.is_banned ? '<span class="hs-banned-tag">⛔ Banned</span>' : '';
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="hs-col-rank">' + rankBadgeHtml(row.rank) + '</td>' +
        '<td class="hs-col-name"><a class="qz-shine-name qz-shine-nopop' + bannedClass + '" href="' + window.QZHiscores.playerUrl('', row.username) + '">' + escapeHtml(row.username) + '</a>' + bannedTag + '</td>' +
        '<td class="hs-col-level">' + Number(level).toLocaleString() + '</td>' +
        '<td class="hs-col-xp">' + Number(xp).toLocaleString() + '</td>';
      body.appendChild(tr);
    });
  }

  // ================= pagination =================
  function renderPagination() {
    const el = document.getElementById('hs-pagination');
    el.innerHTML = '';
    if (currentSkill().placeholder) return;

    const cur = state.currentPage;
    const total = state.totalPages;

    const prev = document.createElement('button');
    prev.type = 'button'; prev.className = 'hs-page-btn'; prev.textContent = '‹';
    prev.disabled = cur <= 1;
    prev.addEventListener('click', () => goToPage(cur - 1));
    el.appendChild(prev);

    const windowStart = Math.floor((cur - 1) / PAGE_WINDOW) * PAGE_WINDOW + 1;
    const windowEnd = Math.min(windowStart + PAGE_WINDOW - 1, total);
    for (let p = windowStart; p <= windowEnd; p++) {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'hs-page-btn' + (p === cur ? ' active' : ''); btn.textContent = String(p);
      btn.addEventListener('click', () => goToPage(p));
      el.appendChild(btn);
    }
    if (windowEnd < total) {
      const dots = document.createElement('span');
      dots.className = 'hs-page-ellipsis'; dots.textContent = '…';
      el.appendChild(dots);
    }

    const next = document.createElement('button');
    next.type = 'button'; next.className = 'hs-page-btn'; next.textContent = '›';
    next.disabled = cur >= total;
    next.addEventListener('click', () => goToPage(cur + 1));
    el.appendChild(next);
  }
  function goToPage(p) {
    if (p < 1 || p > state.totalPages || p === state.currentPage) return;
    state.currentPage = p;
    loadPage();
  }

  // ================= search =================
  const searchInput = document.getElementById('hs-search-input');
  const searchBtn = document.getElementById('hs-search-btn');
  const searchResult = document.getElementById('hs-search-result');

  async function doSearch() {
    const name = (searchInput.value || '').trim();
    searchResult.hidden = false;
    searchResult.className = 'hs-result-box';
    if (!name) { searchResult.textContent = 'Enter a username to search.'; return; }

    searchResult.innerHTML = '<span class="hs-loader-inline"></span>Searching…';
    try {
      const { data, error } = await client().rpc('hiscores_player_stats', { p_username: name });
      if (error) throw error;
      const row = Array.isArray(data) ? data[0] : data;
      if (!row) {
        searchResult.className = 'hs-result-box hs-err';
        searchResult.textContent = 'Player not found.';
        return;
      }
      // Found — go straight to that player's own Highscores page rather
      // than filtering/highlighting the current table.
      window.location.href = window.QZHiscores.playerUrl('', row.username);
    } catch (err) {
      console.error('Highscores: search failed', err);
      searchResult.className = 'hs-result-box hs-err';
      searchResult.textContent = 'Search failed — please try again.';
    }
  }
  searchBtn.addEventListener('click', doSearch);
  searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

  // ================= compare =================
  const compareAInput = document.getElementById('hs-compare-a');
  const compareBInput = document.getElementById('hs-compare-b');
  const compareBtn = document.getElementById('hs-compare-btn');
  const compareResult = document.getElementById('hs-compare-result');

  function doCompare() {
    // CRITICAL: top input is Player 1 / Main Player, bottom input is
    // Player 2 / Comparison Target — this order is passed straight through
    // to compare.html as ?a=<top>&b=<bottom> and must never be swapped.
    const nameA = (compareAInput.value || '').trim();
    const nameB = (compareBInput.value || '').trim();
    compareResult.hidden = false;
    compareResult.className = 'hs-result-box';
    if (!nameA || !nameB) { compareResult.textContent = 'Enter both usernames to compare.'; return; }
    window.location.href = window.QZHiscores.compareUrl('', nameA, nameB);
  }
  compareBtn.addEventListener('click', doCompare);

  // ================= init =================
  // Deep-link support: a link from a player's profile or the Compare page
  // (e.g. clicking "Intelligence" there) arrives as ?skill=<id> and should
  // land on that skill's ranking already selected. The id is only ever
  // trusted after matching it against our own real, non-placeholder
  // registry entries below — an unknown or placeholder id is ignored and
  // the page falls back to its normal Total Level default.
  function getRequestedSkillId() {
    return new URLSearchParams(window.location.search).get('skill');
  }

  async function init() {
    SKILL_REGISTRY = await window.QZHiscores.loadSkillRegistry(client(), '');
    const requested = getRequestedSkillId();
    if (requested) {
      const match = SKILL_REGISTRY.find((s) => s.id === requested && s.real && !s.placeholder);
      if (match) state.selectedSkillId = match.id;
    }
    renderSkillList();
    await loadPage();
  }
  init();
})();
</script>
</body>
</html>
